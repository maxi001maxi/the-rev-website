{{HEADER}}
<main id="main-content">

<time datetime="{{PUBLISHED_ISO}}">{{PUBLISHED_DISPLAY}}</time>{{UPDATED_BLOCK}}
</div>
<h1 class="blog-article-title reveal d2">{{ARTICLE_TITLE_HTML}}</h1>

<p class="blog-article-author reveal d3">{{AUTHOR_LINE}}</p>
</div>
</header>
{{HERO_IMAGE_BLOCK}}
<div class="wrap blog-post-wrap">
{{TOC_BLOCK}}
<div class="blog-body">
{{BODY_HTML}}
</div>
{{AUTHOR_BLOCK}}
{{CTA_BLOCK}}
{{RELATED_BLOCK}}
</div>
</article>
</main>
