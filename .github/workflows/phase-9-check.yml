name: Phase 9 Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/integrations/editorial.mjs'
      - 'api/integrations/editorial-status.mjs'
      - 'lib/editorialBridge.mjs'
      - 'lib/supabaseAdmin.mjs'
      - 'lib/blogMarkdown.mjs'
      - 'scripts/test-phase-9.mjs'
      - 'scripts/test-editorial-brand-qc.mjs'
      - 'scripts/test-phase-d.mjs'
      - 'scripts/build-blog.mjs'
      - 'assets/css/blog.css'
      - 'templates/blog-index.html'
      - 'templates/blog-post.html'
      - '.github/qa/visual-qa.mjs'
      - 'scripts/generate-editorial-image.mjs'
      - 'scripts/render-blog-image.mjs'
      - 'scripts/render-hybrid-editorial-overlay.mjs'
      - 'scripts/auto-editorial-hybrid-image.mjs'
      - 'scripts/qa-editorial-image.mjs'
      - 'lib/editorialImage.mjs'
      - 'lib/editorialImageStyle.mjs'
      - 'lib/editorialImageCopy.mjs'
      - 'lib/editorialHybridImageFormat.mjs'
      - 'lib/editorialAutomatedHybridImage.mjs'
      - 'lib/editorialImageReviewGate.mjs'
      - 'AGENTS.md'
      - 'editorial/EDITORIAL_IMAGE_RUNBOOK.md'
      - 'editorial/editorial-image-system.json'
      - 'editorial/hybrid-image-request.template.json'
      - 'editorial/automated-image-sources.json'
      - 'editorial/fixtures/**.json'
      - 'scripts/compile-hybrid-image-job.mjs'
      - 'scripts/validate-editorial-image-system.mjs'
      - 'editorial/image-jobs/**.json'
      - 'editorial/hybrid-image-jobs/**.json'
      - 'editorial/reference-v23-hybrid-format.json'
      - 'editorial/REFERENCE_V23_HYBRID_FORMAT.md'
      - 'scripts/validate-hybrid-image-jobs.mjs'
      - 'lib/publishFlow.mjs'
      - 'api/admin/publish-preview.mjs'
      - 'api/admin/analytics.mjs'
      - 'lib/ga4Data.mjs'
      - 'admin/analytics/**'
      - 'admin/js/admin-api.mjs'
      - 'scripts/test-phase-e.mjs'
      - 'privacy.html'
      - '.env.example'
      - 'ADMIN_SETUP.md'
      - 'admin/articles/review/**'
      - '.github/workflows/render-editorial-images.yml'
      - '.github/workflows/auto-editorial-hybrid-images.yml'
      - '.github/workflows/deploy-xserver.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/migrations/**'
      - '.github/workflows/phase-9-check.yml'
  push:
    branches: [phase-9-editorial-bridge]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check .github/qa/visual-qa.mjs
      - run: node --check scripts/compile-hybrid-image-job.mjs
      - run: node --check scripts/render-hybrid-editorial-overlay.mjs
      - run: node --check scripts/auto-editorial-hybrid-image.mjs
      - run: node --check lib/editorialAutomatedHybridImage.mjs
      - run: node --check scripts/validate-editorial-image-system.mjs
      - run: node --check lib/editorialImageReviewGate.mjs
      - run: npm run test:phase-9
      - run: node scripts/test-editorial-brand-qc.mjs
      - run: npm run test:phase-d
      - run: npm run test:phase-e
      - run: npm run test:editorial-images
      - run: npm run build:blog
