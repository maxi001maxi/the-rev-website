name: Unified public site QA
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    paths:
      - '*.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/approved-v7-v8/**'
      - 'templates/**'
      - 'scripts/*site*.mjs'
      - 'scripts/test-build-parity.mjs'
      - 'scripts/prepare-deploy.mjs'
      - 'scripts/test-javascript-warm-cache.mjs'
      - 'scripts/qa-unified-site.mjs'
      - 'lib/bookingSiteQa.mjs'
      - 'lib/browserPaintQa.mjs'
      - 'scripts/test-browser-paint.mjs'
      - 'lib/editorialGuardedPhotoEdit.mjs'
      - 'scripts/test-editorial-guarded-photo-edit.mjs'
      - 'package*.json'
      - '.github/workflows/unified-site-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-browser:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-build-parity.mjs
      - run: node --test scripts/test-javascript-warm-cache.mjs
      - run: npm run test:vercel-release-policy
      - run: node --test --test-concurrency=1 scripts/test-booking-site.mjs scripts/test-editorial-guarded-photo-edit.mjs
      - run: node scripts/qa-booking-site.mjs
      - run: node scripts/qa-unified-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-public-site-qa
          path: qa-out/
          retention-days: 14


  technical-browser:
    strategy:
      fail-fast: false
      matrix:
        scope: [behavior, visual]
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-build-parity.mjs
      - run: node --test --test-concurrency=1 scripts/test-browser-paint.mjs
      - run: node scripts/qa-technical-site.mjs
        env:
          TECH_QA_SCOPE: ${{ matrix.scope }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-browser-qa-${{ matrix.scope }}
          path: qa-out/technical/
          retention-days: 14

  deployed-browser:
    if: github.event.action == 'edited' && contains(github.event.pull_request.body, 'REV_PREVIEW_QA')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Bind explicit Preview URL
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const match=event.pull_request.body.match(/<!-- REV_PREVIEW_QA (https:\/\/[a-z0-9-]+\.vercel\.app) -->/);
          if(!match) throw new Error('Explicit Preview marker missing or invalid');
          fs.appendFileSync(process.env.GITHUB_ENV,'BASE_URL='+match[1]+'\n');
          JS
      - name: Test deployed Preview at all seven viewports
        env:
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          QA_OUT: qa-out/deployed-browser
        run: node scripts/qa-unified-site.mjs
      - name: Verify real booking menu controls without customer input
        run: node scripts/qa-booking-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-public-site-qa
          path: qa-out/deployed-browser/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-booking-qa
          path: qa-out/technical/booking*
          retention-days: 14
