name: Admin Insights Preview QA

on:
  push:
    branches:
      - feature/admin-insights-v2
    paths:
      - 'admin/analytics/**'
      - 'admin/css/analytics.css'
      - 'admin/js/admin-analytics.mjs'
      - 'api/admin/analytics.mjs'
      - 'lib/ga4Data.mjs'
      - '.github/qa/admin-insights-qa.mjs'
      - '.github/workflows/admin-insights-preview-qa.yml'

permissions:
  contents: write
  deployments: read

jobs:
  resolve-preview:
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.find.outputs.base_url }}
    steps:
      - name: Wait for Vercel Preview deployment URL
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          url=""
          for i in $(seq 1 60); do
            ids=$(gh api "repos/${REPO}/deployments?sha=${SHA}&per_page=10" --jq '.[].id' 2>/dev/null || echo "")
            for id in $ids; do
              u=$(gh api "repos/${REPO}/deployments/${id}/statuses?per_page=20"                     --jq '[.[] | select(.state=="success") | .environment_url // empty] | first // empty' 2>/dev/null || echo "")
              if [ -n "$u" ]; then url="$u"; break; fi
            done
            if [ -n "$url" ]; then break; fi
            sleep 10
          done
          if [ -z "$url" ]; then
            echo "::error::Preview deployment URL が取得できませんでした。"
            exit 1
          fi
          echo "base_url=$url" >> "$GITHUB_OUTPUT"

  visual:
    needs: resolve-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm i -D playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Run Admin Insights visual QA
        env:
          BASE_URL: ${{ needs.resolve-preview.outputs.base_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OUT_DIR: qa-admin-insights
          LITE_DIR: qa-admin-insights-lite
        run: node .github/qa/admin-insights-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-insights-preview-qa
          path: qa-admin-insights
          retention-days: 7
      - name: Publish lite screenshots to throwaway branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: qa/admin-insights-${{ github.run_id }}
        run: |
          set -eu
          workdir="$(mktemp -d)"
          cp -R qa-admin-insights-lite/. "$workdir"/
          cd "$workdir"
          git init -q -b "$BRANCH"
          git config user.email "noreply@openai.com"
          git config user.name "Admin Insights QA"
          git add -A
          git commit -q -m "Admin Insights preview screenshots"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "screenshots branch: ${BRANCH}"
