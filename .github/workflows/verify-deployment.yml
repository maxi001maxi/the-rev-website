# THE REV. Editorial Console — Deployment Verification
#
# 手動起動（workflow_dispatch）専用。プッシュやデプロイでは自動起動しない
# （Vercelへのすべてのデプロイに対して勝手にActionsが走る状態を避けるため）。
#
# 目的：
#   Claude Codeのセッション実行環境からは、ネットワークegressポリシーにより
#   *.vercel.app / api.vercel.com へ直接アクセスできない。GitHub Actionsの
#   ランナーには通常のインターネットアクセスがあるため、実際のデプロイ先URLへの
#   ヘルスチェック・回帰確認はここで行い、結果をジョブサマリーに残す。
#
# Vercel Deployment Protection（Vercel Authentication）越え：
#   OIDC Federation（Trusted Sources）を検証したが、このプロジェクトでは
#   Trusted Sourcesを設定しても対象デプロイが一貫してVercel Authenticationの
#   ログイン画面（/sso-api）へリダイレクトされ続けたため調査を終了し、
#   Vercel公式の Protection Bypass for Automation 方式へ切り替えた。
#
#   GitHub Repository Secret `VERCEL_AUTOMATION_BYPASS_SECRET`（値はVercelの
#   Project Settings → Deployment Protection → Protection Bypass for
#   Automation で発行したもの）を、すべてのリクエストへ
#   `x-vercel-protection-bypass` ヘッダーとして付与する。
#
#   このSecretはログへ一切出力しない
#   （ワークフロー内で参照した時点でGitHubが自動的にログをマスクする。
#   このworkflow自身もecho等で値を出力する処理を持たない）。
#   Secretが未設定の場合はヘッダーなしで実行し、警告のみ出して安全にフェイルする
#   （Vercel Authenticationが有効な対象では302が返る想定）。
#
# リダイレクト追従：
#   このプロジェクトの vercel.json は trailingSlash: true のため、末尾スラッシュ
#   なしで /api/* を叩くと308でスラッシュ付きへリダイレクトされる（実際のブラウザ
#   fetch()は自動追従するため本番挙動には影響しない）。curlも -L で追従し、
#   POST（Publish系チェック）は --post301/--post302/--post303 でメソッドを
#   維持する（308は元々RFC上メソッド保持が必須で、curlも自動で維持する）。
name: Verify Deployment

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '確認対象のデプロイURL（例: https://the-rev-website-xxxx.vercel.app）'
        required: true
        type: string
      label:
        description: 'このデプロイのラベル（例: Preview / Production）'
        required: false
        type: string
        default: 'Preview'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Run checks against ${{ inputs.base_url }}
        env:
          BASE_URL: ${{ inputs.base_url }}
          LABEL: ${{ inputs.label }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          FAIL=0
          SUMMARY="$GITHUB_STEP_SUMMARY"

          if [ -z "$VERCEL_BYPASS_SECRET" ]; then
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET が設定されていません（Repository Secretsが空）。Bypassヘッダーなしで続行します。"
          fi

          echo "# Deployment Verification — ${LABEL}" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "Target: \`${BASE_URL}\`" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          if [ -n "$VERCEL_BYPASS_SECRET" ]; then
            echo "Vercel Protection Bypass for Automation（\`x-vercel-protection-bypass\`）を付与して実行しました。" >> "$SUMMARY"
          else
            echo "⚠️ VERCEL_AUTOMATION_BYPASS_SECRET が未設定のため、Bypassヘッダーなしで実行しました（Vercel Authenticationが有効な対象では302が返る想定）。" >> "$SUMMARY"
          fi
          echo "" >> "$SUMMARY"
          echo "| Check | Expected | Actual | Result |" >> "$SUMMARY"
          echo "|---|---|---|---|" >> "$SUMMARY"

          check() {
            local name="$1" method="$2" path="$3" expected="$4" grep_for="${5:-}"
            local url="${BASE_URL}${path}"
            local tmp; tmp="$(mktemp)"
            local code
            code=$(curl -sS -o "$tmp" -w "%{http_code}" --max-time 20 -L \
              --post301 --post302 --post303 -X "$method" \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" "$url" || echo "000")
            local ok="❌"
            if [ "$code" = "$expected" ]; then
              if [ -n "$grep_for" ]; then
                if grep -qF "$grep_for" "$tmp"; then ok="✅"; else ok="⚠️ body mismatch"; fi
              else
                ok="✅"
              fi
            fi
            if [ "$ok" != "✅" ]; then FAIL=1; fi
            echo "| ${name} | ${method} ${expected} | ${method} ${code} | ${ok} |" >> "$SUMMARY"
            echo "---- ${name} (${method} ${path}) -> HTTP ${code} ----"
            head -c 500 "$tmp"; echo ""
            rm -f "$tmp"
          }

          check "Health"                    GET  "/api/health"                          200 '"ok":true'
          check "Config (public, no secret)" GET  "/api/config"                          200
          check "Publish preview — unauth"   GET  "/api/admin/publish-preview?id=00000000-0000-0000-0000-000000000000" 401
          check "Publish — unauth"           POST "/api/admin/publish"                   401
          check "TOP page regression"        GET  "/"                                    200 'THE REV'
          check "Blog index regression"      GET  "/blog/"                               200

          # Phase D.1診断：ブラウザへ配信される静的ファイルにGitHub Token/Supabase
          # service_role等の秘匿値が紛れ込んでいないかを、実際に配信されているバイト列で確認する
          # （ソースコード上に無いことは既に確認済みだが、配信経路そのものの確認として実施）。
          echo "" >> "$SUMMARY"
          echo "### 静的ファイルへのSecret露出チェック" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| File | Result |" >> "$SUMMARY"
          echo "|---|---|"  >> "$SUMMARY"
          check_no_secret_leak() {
            local path="$1"
            local url="${BASE_URL}${path}"
            local tmp; tmp="$(mktemp)"
            curl -sS -o "$tmp" --max-time 20 -L \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" "$url" || true
            local ok="✅"
            if grep -qiE "ghp_|github_pat_|service_role|SUPABASE_SERVICE_ROLE_KEY|GITHUB_TOKEN\s*=" "$tmp"; then
              ok="❌"
              FAIL=1
            fi
            echo "| ${path} | ${ok} |" >> "$SUMMARY"
            echo "---- secret-leak check (${path}) -> ${ok} ----"
            rm -f "$tmp"
          }
          check_no_secret_leak "/admin/js/admin-storage.mjs"
          check_no_secret_leak "/admin/js/admin-auth.mjs"
          check_no_secret_leak "/admin/js/admin-api.mjs"
          check_no_secret_leak "/admin/articles/editor/"
          check_no_secret_leak "/admin/articles/review/?id=00000000-0000-0000-0000-000000000000"

          echo "" >> "$SUMMARY"
          if [ "$FAIL" = "1" ]; then
            echo "**結果: 失敗した項目があります。上の表を確認してください。**" >> "$SUMMARY"
          else
            echo "**結果: すべての項目が期待どおりでした。**" >> "$SUMMARY"
          fi

          exit $FAIL
