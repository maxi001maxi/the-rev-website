name: Stage 2 visual acceptance
on:
  push:
    branches: [qa/stage2-visual-8a327f1]
    paths: ['.github/workflows/stage2-visual-acceptance.yml', 'scripts/qa-stage2-release-visual.mjs']
permissions:
  contents: read
jobs:
  visual:
    if: "!contains(github.event.head_commit.message, 'booking-only')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture the explicit candidate Preview at all five widths
        env:
          BASE_URL: https://the-rev-website-7w1emrllj-htrmaxi0101-9305s-projects.vercel.app
          CANDIDATE_SHA: 6b9bd65e6e85ae4a594b10427f8f28c9d99035f7
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VISUAL_OUT: qa-out/stage2-preview
        run: node scripts/qa-stage2-release-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-preview-final-6b9bd65
          path: qa-out/stage2-preview/
          retention-days: 14

  booking:
    if: contains(github.event.head_commit.message, 'booking-only')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Operate three real menus on PC and mobile without entering data
        env:
          BOOKING_QA_OUT: qa-out/stage2-booking
        run: node scripts/qa-booking-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-real-booking-8a327f1
          path: qa-out/stage2-booking/
          retention-days: 14
