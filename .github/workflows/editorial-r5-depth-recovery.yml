name: Editorial R7 Portrait Framing QC Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-r5-depth-recovery.yml'
      - 'scripts/offline-r5-depth-recovery.py'
      - 'scripts/prepare-editorial-r5-depth-review.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: editorial-r7-portrait-qc-no-image-api
  cancel-in-progress: false

jobs:
  offline-depth-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EDITORIAL_IMAGE_DISABLE_GENERATION: '1'
      EDITORIAL_IMAGE_MAX_ATTEMPTS: '1'
      EDITORIAL_IMAGE_GENERATION_MODEL: 'gpt-5.6'
      EDITORIAL_IMAGE_QA_MODEL: 'gpt-5.6'
      R5_QUARANTINE_RUN: '38673164344'

    steps:
      - name: Checkout read-only main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Download and extract SHA-verified rejected R5 media
        run: |
          set -euo pipefail
          mkdir -p .offline-review/rejected-source
          gh run download "$R5_QUARANTINE_RUN" -R "$GITHUB_REPOSITORY" \
            --name "editorial-rejected-image-evidence-$R5_QUARANTINE_RUN" \
            --dir .offline-review/rejected-source
          test -s .offline-review/rejected-source/editorial-operator-rejected.tar.gz
          tar -xzf .offline-review/rejected-source/editorial-operator-rejected.tar.gz \
            -C .offline-review/rejected-source

      - name: Verify real-source and historical fingerprints BEFORE model calls
        run: |
          set -euo pipefail
          node scripts/prepare-editorial-r5-depth-review.mjs
          test -s .offline-review/preflight.json

      - name: Apply zero-generation background depth to existing R5 scene only
        run: |
          set -euo pipefail
          python3 -m pip install --user "Pillow>=10,<13"
          scene="$(node -p "require('./.offline-review/preflight.json').scene_path")"
          python3 scripts/offline-r5-depth-recovery.py \
            --archive-dir .offline-review/rejected-source \
            --output "$scene" --report .offline-review/depth-report.json
          test -s "$scene"

      - name: Install production typography and image-QA renderer
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "::error::Only independent QA API is required"; exit 1; }
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Render 3 production sizes and independent QA WITHOUT image generation
        run: |
          set -euo pipefail
          test "$EDITORIAL_IMAGE_DISABLE_GENERATION" = '1'
          test "$(node -p "require('./.offline-review/r6-image-job.json').automation.paid_image_generation_allowed")" = 'false'
          node scripts/auto-editorial-hybrid-image.mjs .offline-review/r6-image-job.json

      - name: Assemble private R7 compare/QC artifact (never publish)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .offline-review/reviewer
          for p in .offline-review/preflight.json .offline-review/depth-report.json .offline-review/r6-image-job.json; do
            if [ -f "$p" ]; then cp "$p" .offline-review/reviewer/; fi
          done
          state='editorial/image-operator-state/personal-gym-first-session-pain-health-history.json'
          if [ -f "$state" ]; then cp "$state" .offline-review/reviewer/operator-state.json; fi
          qa='editorial/image-qa/personal-gym-first-session-pain-health-history-reference-v26-grounded-lobbysp-20261015-pain-r7-depth-portrait-offline.json'
          if [ -f "$qa" ]; then cp "$qa" .offline-review/reviewer/independent-visual-qa.json; fi
          if [ -s .offline-review/r6-image-job.json ]; then
            for key in thumbnail og_image gbp_image; do
              path="$(KEY="$key" node -e "console.log(require('./.offline-review/r6-image-job.json')[process.env.KEY] || '')")"
              if [ -s "$path" ]; then cp "$path" ".offline-review/reviewer/$key.jpg"; fi
            done
          fi
          if [ -f .offline-review/preflight.json ]; then
            scene="$(node -p "require('./.offline-review/preflight.json').scene_path")"
            if [ -f "$scene" ]; then cp "$scene" .offline-review/reviewer/scene-depth.png; fi
          fi
          if [ -d .operator-rejected-evidence ]; then
            cp -a .operator-rejected-evidence .offline-review/reviewer/rejected-unapproved
          fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          r=Path('.offline-review/reviewer')
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in r.iterdir() if p.is_file()}
          state=json.loads((r/'operator-state.json').read_text()) if (r/'operator-state.json').exists() else {}
          qa=json.loads((r/'independent-visual-qa.json').read_text()) if (r/'independent-visual-qa.json').exists() else {}
          ready=(state.get('status')=='READY_CANDIDATE' and qa.get('pass') is True
                 and qa.get('scene_grounding',{}).get('pass') is True
                 and all((r/(x+'.jpg')).is_file() for x in ['thumbnail','og_image','gbp_image']))
          (r/'evaluation.json').write_text(json.dumps({
             'qc_pass_and_three_images_present':ready,
             'independent_qc_result':qa.get('pass'),
             'qa_source_grounding_pass':qa.get('scene_grounding',{}).get('pass'),
             'image_generation_api_calls':0,
             'independent_qa_model_may_be_billed':True,
             'xserver_staging_performed':False,'published':False,
             'review_required':True,'file_sha256':files
          },indent=2)+'\n')
          print(json.dumps({'ready_for_human_review':ready,'files':list(files)}))
          PY

      - name: Upload source-preserving R7 outputs for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-20261015-portrait-r7-review-${{ github.run_id }}
          path: .offline-review/reviewer/
          retention-days: 7
          if-no-files-found: warn

      - name: Fail closed unless independent Visual QC passes and all 3 images exist
        if: always()
        run: |
          set -euo pipefail
          test -s .offline-review/reviewer/evaluation.json
          node -e "const e=require('./.offline-review/reviewer/evaluation.json'); if(e.qc_pass_and_three_images_present!==true){console.error('::error::R7 independent Visual QC rejected. No FTP/commit/publish; evidence saved.');process.exit(1)}"
          echo "::notice::R7 QC PASS but held for owner's review. No publish or Xserver stage."
