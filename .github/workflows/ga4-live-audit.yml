name: GA4 Live Audit

on:
  push:
    branches:
      - feature/ga4-admin-analytics
    paths:
      - '.github/workflows/ga4-live-audit.yml'
      - '.github/qa/analytics-qa.mjs'
      - 'scripts/audit-ga4-live.mjs'
      - 'assets/js/main.js'
      - 'index.html'
      - 'scripts/build-blog.mjs'
      - 'api/ga4-config-status.mjs'

permissions:
  contents: read

jobs:
  local-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve branch locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/the-rev-http.log 2>&1 &
          echo $! > /tmp/the-rev-http.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/the-rev-http.log
          exit 1

      - name: Verify Website Insights runtime
        env:
          BASE_URL: http://127.0.0.1:4173
          GA4_MEASUREMENT_ID: G-Q6ZSSJMEZ2
        run: node .github/qa/analytics-qa.mjs

      - name: Upload runtime result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-runtime-qa
          path: analytics-runtime-qa.json
          retention-days: 7

  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Audit production GA4 / GTM
        env:
          PRODUCTION_URL: https://therev-lab.com
          GTM_ID: GTM-WFD7R8BT
          GA4_MEASUREMENT_ID: G-Q6ZSSJMEZ2
        run: node scripts/audit-ga4-live.mjs

      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga4-live-audit
          path: ga4-live-audit.json
          retention-days: 7

  admin-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://the-rev-website-git-feature-g-0360ab-htrmaxi0101-9305s-projects.vercel.app
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Wait for Vercel branch preview
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/preview.html -w '%{http_code}' -L --max-time 20 \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" \
              "${PREVIEW_URL}/admin/analytics/" || echo 000)
            if [ "$code" = "200" ] && grep -qF 'THE REV.' /tmp/preview.html; then
              echo "Preview ready."
              exit 0
            fi
            echo "Waiting for preview (${i}/24), HTTP ${code}"
            sleep 10
          done
          exit 1

      - name: Verify Admin Analytics unauthenticated boundary
        run: |
          set -euo pipefail
          page_code=$(curl -sS -o /tmp/analytics.html -w '%{http_code}' -L --max-time 20 \
            -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" \
            "${PREVIEW_URL}/admin/analytics/")
          api_code=$(curl -sS -o /tmp/analytics-api.json -w '%{http_code}' -L --max-time 20 \
            -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" \
            "${PREVIEW_URL}/api/admin/analytics?range=7d")
          test "$page_code" = "200"
          test "$api_code" = "401"
          grep -qF 'Analytics' /tmp/analytics.html

          # Service account material must never be shipped in the browser bundle.
          ! grep -qF 'GA4_SERVICE_ACCOUNT_JSON' /tmp/analytics.html
          ! grep -qF 'private_key' /tmp/analytics.html

          curl -sS -L --max-time 20 \
            -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" \
            "${PREVIEW_URL}/admin/js/admin-analytics.mjs" > /tmp/admin-analytics.mjs
          ! grep -qF 'GA4_SERVICE_ACCOUNT_JSON' /tmp/admin-analytics.mjs
          ! grep -qF 'private_key' /tmp/admin-analytics.mjs

          status_code=$(curl -sS -o /tmp/ga4-status.json -w '%{http_code}' -L --max-time 20 \
            -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" \
            "${PREVIEW_URL}/api/ga4-config-status")
          test "$status_code" = "200"
          echo "GA4_CONFIG_STATUS"
          cat /tmp/ga4-status.json
          echo ""
          echo "Admin Analytics preview smoke: PASS"
