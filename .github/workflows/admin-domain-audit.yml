name: Admin Domain Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/admin-domain-cutover
    paths:
      - '.github/workflows/admin-domain-audit.yml'
      - 'vercel.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_DOMAIN: admin.therev-lab.com
      APEX_DOMAIN: therev-lab.com
      VERCEL_PROJECT_URL: https://the-rev-website.vercel.app
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Install DNS tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify Vercel Admin deployment
        run: |
          set -euo pipefail
          echo "VERCEL_ADMIN_SMOKE"

          fetch() {
            local path="$1"
            local out="$2"
            local code
            code=$(curl -sS -L -o "$out" -w '%{http_code}' --connect-timeout 10 --max-time 25 \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" \
              "${VERCEL_PROJECT_URL}${path}")
            echo "${path}=${code}"
            test "$code" = "200"
          }

          fetch "/admin/login/" /tmp/login.html
          fetch "/admin/" /tmp/dashboard.html
          fetch "/admin/analytics/" /tmp/analytics.html

          config_code=$(curl -sS -L -o /tmp/config.json -w '%{http_code}' --connect-timeout 10 --max-time 25 \
            -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" \
            "${VERCEL_PROJECT_URL}/api/config")
          echo "api_config=${config_code}"
          test "$config_code" = "200"

          grep -qF 'THE REV.' /tmp/login.html
          grep -qF 'Editorial Console' /tmp/login.html
          grep -qF 'Dashboard' /tmp/dashboard.html
          grep -qF 'Analytics' /tmp/analytics.html

          api_code=$(curl -sS -L -o /tmp/api.json -w '%{http_code}' --connect-timeout 10 --max-time 25 \
            -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" \
            "${VERCEL_PROJECT_URL}/api/admin/analytics?range=7d")
          echo "unauthenticated_analytics_api=${api_code}"
          test "$api_code" = "401"

          echo "vercel_admin_static_and_auth_boundary=PASS"

      - name: Verify unauthenticated browser redirect
        run: |
          cat > /tmp/admin-redirect-check.mjs <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.VERCEL_PROJECT_URL;
          const bypass = process.env.VERCEL_BYPASS_SECRET;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            extraHTTPHeaders: {
              'x-vercel-protection-bypass': bypass
            }
          });
          const page = await context.newPage();
          await page.goto(base + '/admin/', { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.waitForURL(/\/admin\/login\/?$/, { timeout: 15000 });
          const form = page.locator('#login-form');
          if (await form.count() !== 1) throw new Error('Login form not found after redirect.');
          console.log('unauthenticated_redirect=' + page.url());
          console.log('login_form=PASS');
          await browser.close();
          NODE
          node /tmp/admin-redirect-check.mjs

      - name: Audit Admin custom-domain DNS and HTTPS
        run: |
          set -u
          echo "ADMIN_DOMAIN_AUDIT"
          echo "apex_ns=$(dig +short NS "$APEX_DOMAIN" | tr '\n' ',' | sed 's/,$//')"
          echo "admin_cname=$(dig +short CNAME "$ADMIN_DOMAIN" | tr '\n' ',' | sed 's/,$//')"
          echo "admin_a=$(dig +short A "$ADMIN_DOMAIN" | tr '\n' ',' | sed 's/,$//')"
          echo "admin_aaaa=$(dig +short AAAA "$ADMIN_DOMAIN" | tr '\n' ',' | sed 's/,$//')"

          code=$(curl -sS -L -o /tmp/admin-body -w '%{http_code}' --connect-timeout 10 --max-time 20 "https://$ADMIN_DOMAIN/" || true)
          location=$(curl -sSI --connect-timeout 10 --max-time 20 "https://$ADMIN_DOMAIN/" 2>/dev/null | tr -d '\r' | awk 'tolower($1)=="location:" {print $2; exit}')
          echo "https_code=${code:-000}"
          echo "location=${location:-}"
          if [ -s /tmp/admin-body ]; then
            if grep -qF 'THE REV.' /tmp/admin-body; then echo "the_rev_html=true"; else echo "the_rev_html=false"; fi
            if grep -qF 'Editorial Console' /tmp/admin-body; then echo "editorial_console_html=true"; else echo "editorial_console_html=false"; fi
          else
            echo "the_rev_html=false"
            echo "editorial_console_html=false"
          fi
