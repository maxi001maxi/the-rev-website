name: Production public site acceptance
on:
  workflow_run:
    workflows: ['Deploy to Xserver']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  deployed-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.gate.outputs.deployed }}
    steps:
      - id: gate
        name: Require a successful deploy job, excluding planner SKIP
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/deploy-jobs.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const {jobs}=JSON.parse(fs.readFileSync('/tmp/deploy-jobs.json','utf8'));
          const deployed=jobs.some(job=>job.name.startsWith('Build → Deploy → Verify (')&&job.conclusion==='success');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'deployed='+deployed+'\n');
          console.log(deployed?'Actual deployment completed; run live acceptance':'Planner SKIP or no successful deployment; browser job remains skipped');
          NODE
  public-browser:
    needs: deployed-release
    if: needs.deployed-release.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run vercel-build
      - name: Compare normal public URLs with exact deployed build
        id: live_bytes
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p qa-out/production
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import path from 'node:path';
          const files=['index.html','solution.html','trainer.html','price.html','blog/index.html','access.html','robots.txt','sitemap.xml','assets/css/style.css','assets/js/main.js'];
          function collectPublishedBlog(dir){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const file=path.join(dir,entry.name);if(entry.isDirectory())collectPublishedBlog(file);else if(entry.name==='index.html'){const relative=path.relative('dist',file);if(!files.includes(relative))files.push(relative);}}}
          collectPublishedBlog('dist/blog');
          const checks=[];
          const versionedScripts=new Set();
          for(const file of files){
            const pathname=file==='index.html'?'/':file.startsWith('blog/')?'/'+file.replace(/index\.html$/,''):'/'+file;
            const response=await fetch('https://therev-lab.com'+pathname,{signal:AbortSignal.timeout(30000)});
            const body=Buffer.from(await response.arrayBuffer());
            const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
            const actual=hash(body),expected=hash(fs.readFileSync('dist/'+file));
            checks.push({path:pathname,http:response.status,actual,expected,match:actual===expected,xRobotsTag:response.headers.get('x-robots-tag')});
            if(file.endsWith('.html')){
              for(const match of fs.readFileSync('dist/'+file,'utf8').matchAll(/src=["']([^"']*assets\/js\/(?:main|unified-navigation|home-v7)\.js\?v=[a-f0-9]{12})["']/g))versionedScripts.add(new URL(match[1],'https://therev-lab.com'+pathname).pathname+'?'+new URL(match[1],'https://therev-lab.com'+pathname).searchParams);
            }
          }
          for(const pathname of versionedScripts){
            const response=await fetch('https://therev-lab.com'+pathname,{signal:AbortSignal.timeout(30000)});
            const body=Buffer.from(await response.arrayBuffer()),file=new URL('https://therev-lab.com'+pathname).pathname.slice(1);
            const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
            const actual=hash(body),expected=hash(fs.readFileSync('dist/'+file));
            checks.push({path:pathname,http:response.status,actual,expected,match:actual===expected,xRobotsTag:response.headers.get('x-robots-tag')});
          }
          const report={releaseSha:process.env.RELEASE_SHA,releaseRun:process.env.RELEASE_RUN,observedAt:new Date().toISOString(),method:'GET only; no JavaScript or analytics execution',checks};
          fs.writeFileSync('qa-out/production/live-bytes.json',JSON.stringify(report,null,2));
          for(const row of checks){assert.equal(row.http,200,row.path);assert.ok(row.match,row.path+' exact production bytes');assert.ok(!/noindex/i.test(row.xRobotsTag||''),row.path+' header indexable');}
          console.log('Production byte acceptance PASS: '+checks.length+' normal visitor URLs');
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Verify returning-visitor JavaScript cache replacement
        if: hashFiles('scripts/test-javascript-warm-cache.mjs') != ''
        run: node --test scripts/test-javascript-warm-cache.mjs
      - name: Operate all six public pages at seven viewport sizes
        env:
          BASE_URL: https://therev-lab.com
          QA_OUT: qa-out/production/browser
        run: node scripts/qa-unified-site.mjs
      - name: Verify actual public GTM and intent requests without transmission
        if: always() && steps.live_bytes.outcome == 'success'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const report={scope:'Actual production HTTP and browser; collection fulfilled locally before transmission',analyticsTransmitted:0,ga4Receipt:'UNVERIFIED',pages:[]};
          const browser=await chromium.launch({headless:true});
          try {
            for(const pathname of ['/','/solution.html','/trainer.html','/price.html','/blog/','/access.html','/blog/training-how-hard-to-push/']){
              const row={pathname,collection:[],cdn:[],errors:[]};report.pages.push(row);
              const context=await browser.newContext({viewport:{width:1440,height:900},serviceWorkers:'block'});
              await context.route('**/*',async route=>{
                const req=route.request(),u=new URL(req.url());
                if(/google-analytics\.com$|analytics\.google\.com$/.test(u.hostname)||/\/(?:g\/)?collect(?:\/|$)/.test(u.pathname)){
                  const params=u.searchParams;
                  for(const line of (req.postData()||'').split('\n')){
                    const body=new URLSearchParams(line);
                    row.collection.push({measurementId:params.get('tid')||body.get('tid'),event:body.get('en')||params.get('en'),pageType:body.get('ep.page_type')||params.get('ep.page_type'),placement:body.get('ep.placement')||params.get('ep.placement'),intercepted:true});
                  }
                  await route.fulfill({status:204,headers:{'access-control-allow-origin':'*'},body:''});return;
                }
                if(req.method()==='GET'&&(u.origin==='https://therev-lab.com'||u.hostname==='www.googletagmanager.com')){await route.continue();return;}
                await route.abort();
              });
              const page=await context.newPage();
              page.on('pageerror',e=>row.errors.push(e.message));
              page.on('response',r=>{if(r.url().startsWith('https://www.googletagmanager.com/'))row.cdn.push({path:new URL(r.url()).pathname,status:r.status()});});
              try {
                const response=await page.goto('https://therev-lab.com'+pathname,{waitUntil:'load',timeout:45000});
                assert.equal(response.status(),200);
                await page.waitForFunction(()=>!!window.google_tag_manager?.['GTM-WFD7R8BT'],{},{timeout:15000});
                const intent=await page.evaluate(()=>{
                  const track=location.pathname.startsWith('/blog/')&&location.pathname!=='/blog/'?'article_cta_click':'reserve_click';
                  const a=document.querySelector('a[data-track="'+track+'"]');
                  if(!a)return null;
                  document.addEventListener('click',e=>{if(e.target.closest('a'))e.preventDefault();},true);
                  a.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));return track;
                });
                assert.ok(intent,'existing intent CTA must exist');
                const deadline=Date.now()+15000;
                while(Date.now()<deadline&&(!row.collection.some(e=>e.event==='page_view')||!row.collection.some(e=>e.event===intent)))await new Promise(r=>setTimeout(r,100));
                row.dataLayer=await page.evaluate(()=>({starts:dataLayer.filter(e=>e.event==='gtm.js').length,intents:dataLayer.filter(e=>['reserve_click','article_cta_click'].includes(e.event)).map(e=>({event:e.event,page_type:e.page_type,placement:e.placement,event_version:e.event_version}))}));
                assert.equal(row.dataLayer.starts,1);
                assert.equal(row.dataLayer.intents.filter(e=>e.event===intent).length,1);
                const expectedType={'/':'home','/solution.html':'recovery','/trainer.html':'trainer','/price.html':'price','/blog/':'blog_index','/access.html':'access','/blog/training-how-hard-to-push/':'blog_article'}[pathname];
                const emitted=row.dataLayer.intents.find(e=>e.event===intent);
                assert.equal(emitted.page_type,expectedType);assert.equal(emitted.event_version,'e1_v1');assert.ok(emitted.placement);
                const collected=row.collection.filter(e=>e.measurementId==='G-Q6ZSSJMEZ2');
                assert.equal(collected.filter(e=>e.event==='page_view').length,1);
                assert.equal(collected.filter(e=>e.event===intent).length,1);
                assert.ok(row.cdn.some(e=>e.status===200&&e.path.startsWith('/gtag/')));
                assert.deepEqual(row.errors,[]);row.status='PASS';
              } catch(e){row.status='FAIL';row.failure=e.message;}
              finally{await context.close();}
            }
          } finally {
            await browser.close();
            fs.mkdirSync('qa-out/production',{recursive:true});
            fs.writeFileSync('qa-out/production/measurement.json',JSON.stringify(report,null,2));
          }
          assert.equal(report.pages.length,7);
          assert.ok(report.pages.every(p=>p.status==='PASS'),JSON.stringify(report.pages.filter(p=>p.status!=='PASS')));
          console.log('Actual production GTM/Google tag + single page_view/intent request construction PASS on 7 pages; analytics transmitted 0; receipt UNVERIFIED');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-public-site-acceptance-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: qa-out/
          retention-days: 14
