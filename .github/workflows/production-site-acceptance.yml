name: Production public site acceptance
on:
  workflow_run:
    workflows: ['Deploy to Xserver']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  public-browser:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run vercel-build
      - name: Compare normal public URLs with exact deployed build
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p qa-out/production
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const files=['index.html','solution.html','trainer.html','price.html','blog/index.html','access.html','robots.txt','sitemap.xml','assets/css/style.css','assets/js/main.js'];
          const checks=[];
          for(const file of files){
            const pathname=file==='index.html'?'/':file==='blog/index.html'?'/blog/':'/'+file;
            const response=await fetch('https://therev-lab.com'+pathname,{signal:AbortSignal.timeout(30000)});
            const body=Buffer.from(await response.arrayBuffer());
            const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
            const actual=hash(body),expected=hash(fs.readFileSync('dist/'+file));
            checks.push({path:pathname,http:response.status,actual,expected,match:actual===expected,xRobotsTag:response.headers.get('x-robots-tag')});
          }
          const report={releaseSha:process.env.RELEASE_SHA,releaseRun:process.env.RELEASE_RUN,observedAt:new Date().toISOString(),method:'GET only; no JavaScript or analytics execution',checks};
          fs.writeFileSync('qa-out/production/live-bytes.json',JSON.stringify(report,null,2));
          for(const row of checks){assert.equal(row.http,200,row.path);assert.ok(row.match,row.path+' exact production bytes');assert.ok(!/noindex/i.test(row.xRobotsTag||''),row.path+' header indexable');}
          console.log('Production byte acceptance PASS: '+checks.length+' normal visitor URLs');
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Operate all six public pages at seven viewport sizes
        env:
          BASE_URL: https://therev-lab.com
          QA_OUT: qa-out/production/browser
        run: node scripts/qa-unified-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-public-site-acceptance-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: qa-out/
          retention-days: 14
