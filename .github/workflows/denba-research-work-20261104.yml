name: DENBA research draft - final canonical preflight
on:
  push:
    branches: [work/denba-research-draft-20261104]
    paths: ['.github/workflows/denba-research-work-20261104.yml']
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Browser typography regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npx playwright install --with-deps chromium
          npm run test:thumbnail-typography-browser
      - name: Canonical publish preflight on actual production draft and main image bytes
        run: node editorial/prepublication/2026-11-04-denba-research/final-preflight.mjs
      - name: Save verified unpublished readiness
        run: |
          set -euo pipefail
          git add -- editorial/prepublication/2026-11-04-denba-research/FINAL_PREFLIGHT.json
          git -c user.name='THE REV Editorial Work' -c user.email='actions@users.noreply.github.com' commit -m 'Verify actual DENBA research CMS draft with canonical main and Xserver preflight'
          git push origin HEAD:work/denba-research-draft-20261104
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: denba-research-final-preflight-${{ github.run_id }}
          path: editorial/prepublication/2026-11-04-denba-research/FINAL_PREFLIGHT.json
