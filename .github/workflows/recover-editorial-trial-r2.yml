name: Recover editorial trial R2 checkpoint
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-editorial-trial-r2.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: recover-editorial-trial-r2-20261014
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XSERVER_FTP_HOST: sv14602.xserver.jp
      XSERVER_FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
      XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Download the official R2 image-operator checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38498453403
          github-token: ${{ github.token }}
          name: editorial-operator-checkpoint-38498453403
          path: ${{ runner.temp }}/source-checkpoint
      - name: Restore byte-identical images and original independent quality report
        run: |
          set -euo pipefail
          RESTORED="$RUNNER_TEMP/restored"
          mkdir -p "$RESTORED"
          tar -xzf "$RUNNER_TEMP/source-checkpoint/editorial-operator-checkpoint.tar.gz" -C "$RESTORED"
          cp -a "$RESTORED/assets/images/." assets/images/
          cp "$RESTORED/editorial/image-qa/the-rev-trial-three-menus-first-visit-reference-v26-grounded-lobbysp-20261014-trial-r2.json" editorial/image-qa/
          cp "$RESTORED/editorial/image-operator-state/the-rev-trial-three-menus-first-visit.json" editorial/image-operator-state/
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {HYBRID_IMAGE_FORMAT} from './lib/editorialHybridImageFormat.mjs';
          const slug='the-rev-trial-three-menus-first-visit';
          const path='editorial/hybrid-image-jobs/'+slug+'.json';
          const job=JSON.parse(fs.readFileSync(path));
          const qa=JSON.parse(fs.readFileSync(job.qa_report_path));
          const state=JSON.parse(fs.readFileSync('editorial/image-operator-state/'+slug+'.json'));
          const version='reference-v26-grounded-lobbysp-20261014-trial-r2';
          if(job.asset_version!==version||qa.asset_version!==version||state.asset_version!==version)
            throw Error('R2_VERSION_MISMATCH');
          if(qa.pass!==true||qa.scene_grounding?.pass!==true||qa.thumbnail_typography_acceptance?.pass!==true||
            qa.visual_art_direction?.pass!==true||qa.gbp_aspect_ratio_pass!==true||
            qa.gbp_safe_area_pass!==true||qa.trainer_present!==false||state.status!=='READY_CANDIDATE')
            throw Error('INDEPENDENT_R2_QC_MISSING_OR_FAILED');
          const files={source:job.automation.source_repo_path,scene:job.generated_scene_path,
            thumbnail:job.thumbnail,og:job.og_image,gbp:job.gbp_image};
          for(const [key,filename] of Object.entries(files)){
            const sha=createHash('sha256').update(fs.readFileSync(filename)).digest('hex');
            if(sha!==qa.scene_grounding.asset_hashes[key])throw Error('R2_SHA256_MISMATCH_'+key);
          }
          const originals=job.style_references;
          if(JSON.stringify(originals)!==JSON.stringify(HYBRID_IMAGE_FORMAT.designReferenceAssets)){
            job.recovery_note+=' ORIGINAL_R2_GENERATION_REFERENCES='+JSON.stringify(originals)+
              '. Original R2 independently passed approved Golden Typography and Art Direction checks;'+
              ' metadata normalized to the canonical validator reference list after generation.';
            job.style_references=HYBRID_IMAGE_FORMAT.designReferenceAssets;
          }
          fs.writeFileSync(path,JSON.stringify(job,null,2)+'\n');
          console.log('ORIGINAL_R2_QC_AND_ALL_IMAGE_SHA256_PASS');
          JS
      - name: Pass full official image system validation
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/validate-hybrid-image-jobs.mjs
          node scripts/validate-editorial-image-system.mjs
          npm run test:phase-9
      - name: Securely stage only the three R2 public images
        run: |
          set -euo pipefail
          test -n "$XSERVER_FTP_USER"
          test -n "$XSERVER_FTP_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const j=JSON.parse(fs.readFileSync('editorial/hybrid-image-jobs/the-rev-trial-three-menus-first-visit.json'));
          fs.writeFileSync('.trial-r2-images',[j.thumbnail,j.og_image,j.gbp_image].join('\n')+'\n');
          JS
          CMDS="$(mktemp)"
          trap 'rm -f "$CMDS"' EXIT
          {
            echo 'set ftp:ssl-force true'
            echo 'set ftp:ssl-protect-data true'
            echo 'set ftp:passive-mode true'
            echo 'set ssl:verify-certificate yes'
            echo 'set net:max-retries 3'
            echo 'set net:timeout 25'
            echo 'mkdir -p /assets/images/blog'
            echo 'mkdir -p /assets/images/blog/og'
            echo 'mkdir -p /assets/images/gbp'
            while IFS= read -r p; do echo "put \"$p\" -o \"/$p\""; done < .trial-r2-images
            echo 'bye'
          } > "$CMDS"
          for ATTEMPT in 1 2 3; do
            if lftp -u "$XSERVER_FTP_USER","$XSERVER_FTP_PASSWORD" "$XSERVER_FTP_HOST" < "$CMDS"; then
              echo 'R2_FTPS_STAGE_SUCCESS'
              exit 0
            fi
            sleep "$((15*ATTEMPT))"
          done
          echo "::error::R2_FTPS_STAGE_FAILED"
          exit 1
      - name: Independently verify Xserver asset bytes before accepting
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          while IFS= read -r p; do
            test -n "$p" || continue
            expected="$(sha256sum "$p" | awk '{print $1}')"
            ok=0
            for n in $(seq 1 20); do
              code="$(curl -sS -L -o "$TMP/public" -w '%{http_code}' --connect-timeout 8 --max-time 25 "https://therev-lab.com/$p?checkpoint=38498453403&run=$GITHUB_RUN_ID&try=$n" || echo 000)"
              if [ "$code" = 200 ] && [ -s "$TMP/public" ] && [ "$(sha256sum "$TMP/public" | awk '{print $1}')" = "$expected" ]; then
                echo "PUBLIC_R2_SHA256_VERIFIED $p"
                ok=1
                break
              fi
              sleep 15
            done
            test "$ok" = 1 || { echo "::error::R2_PUBLIC_BYTES_MISMATCH $p"; exit 1; }
          done < .trial-r2-images
      - name: Save verified R2 assets and operator state to main
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p='editorial/image-operator-state/the-rev-trial-three-menus-first-visit.json';
          const j=JSON.parse(fs.readFileSync(p));
          if(j.status!=='READY_CANDIDATE')throw Error('NOT_READY');
          j.xserver_verified=true;
          j.xserver_verified_at=new Date().toISOString();
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          JS
          git config user.name "THE REV Editorial Image Operator"
          git config user.email "actions@users.noreply.github.com"
          git add editorial/hybrid-image-jobs/the-rev-trial-three-menus-first-visit.json
          git add editorial/image-qa/the-rev-trial-three-menus-first-visit-reference-v26-grounded-lobbysp-20261014-trial-r2.json
          git add editorial/image-operator-state/the-rev-trial-three-menus-first-visit.json
          git add assets/images/blog/*the-rev-trial-three-menus-first-visit*
          git add assets/images/blog/og/*the-rev-trial-three-menus-first-visit*
          git add assets/images/gbp/*the-rev-trial-three-menus-first-visit*
          git add assets/images/editorial-generated/*the-rev-trial-three-menus-first-visit*
          git commit -m "Generate Editorial Hybrid image assets (verified R2 checkpoint recovery)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
