name: GA4 Direct Sync Now

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ga4-direct-sync-now.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN_1: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_2: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_3: ${{ secrets.VERCEL_AUTH_TOKEN }}
      VERCEL_TOKEN_4: ${{ secrets.VERCEL_API_TOKEN }}
      TEAM_ID: team_Tr078zaEJtEFM8mC2epaOchj
      PROJECT_ID: prj_9hyAl1rZNNNBnv7JxFZSzcM8mGs8

    steps:
      - uses: actions/checkout@v4

      - name: Trigger deployed GA4 cron now
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=''
          for candidate in "$VERCEL_TOKEN_1" "$VERCEL_TOKEN_2" "$VERCEL_TOKEN_3" "$VERCEL_TOKEN_4"; do
            if [ -n "$candidate" ]; then TOKEN="$candidate"; break; fi
          done

          if [ -z "$TOKEN" ]; then
            echo 'vercel_api_token_present=false'
            exit 1
          fi
          echo 'vercel_api_token_present=true'

          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$PROJECT_ID" "$TEAM_ID" > .vercel/project.json

          npx --yes vercel@62.4.0 crons ls --format json --token "$TOKEN"
          npx --yes vercel@62.4.0 crons run '/api/integrations/editorial-status?mode=company_os_ga4_cron' --token "$TOKEN"
