name: Recover Oct15 Editorial Blog Publish (scoped, no GBP)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-oct15-blogfast-publish.yml'

permissions:
  contents: read

concurrency:
  group: xserver-production-v3
  cancel-in-progress: false

jobs:
  scoped-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XSERVER_FTP_HOST: sv14602.xserver.jp
      XSERVER_REMOTE_DIR: /
      PRODUCTION_URL: https://therev-lab.com
      PUBLISH_COMMIT: 7913093151419e8732498e7096442f8590328f2f
      PRE_PUBLISH_COMMIT: c7831aed5d8f750df067ab7225e0172c9e3fb447
      TARGET_SLUG: personal-gym-first-session-pain-health-history
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate immutable publish target and exact source lineage
        run: |
          set -euo pipefail
          article="content/blog/${TARGET_SLUG}.md"
          test "$(git rev-parse "$PUBLISH_COMMIT:$article")" = "$(git rev-parse "HEAD:$article")"
          test "$(git rev-parse "$PUBLISH_COMMIT^")" = "$PRE_PUBLISH_COMMIT"
          git merge-base --is-ancestor "$PUBLISH_COMMIT" HEAD
          test ! -e "content/blog/another-20261015-recovery.md"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const s=fs.readFileSync('content/blog/personal-gym-first-session-pain-health-history.md','utf8');
          if(!s.includes('status: "published"') ||
             !s.includes('reference-v26-grounded-lobbysp-20261015-pain-r7-depth-portrait-offline') ||
             !s.includes('published: "2026-10-15"')) throw Error('ARTICLE_SOURCE_NOT_EXACT_R7_PUBLISH');
          JS
      - name: Build current production content
        run: |
          set -euo pipefail
          npm run vercel-build
          test -f dist/blog/index.html
          test -f "dist/blog/$TARGET_SLUG/index.html"
          test -f dist/blog/.htaccess
          test -f dist/sitemap.xml
          node scripts/verify-blog-categories.mjs dist
          rm -rf deploy
          cp -a dist deploy
          rm -rf deploy/admin
      - name: Build prepublication state and generate exact diff
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/rev-blog-before-publish"
          git worktree add --detach "$BASE" "$PRE_PUBLISH_COMMIT"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE/node_modules"
          (cd "$BASE" && npm run vercel-build >/dev/null)
          node scripts/xserver-blog-delta.mjs --old-root "$BASE/dist/blog" --new-root "deploy/blog"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('.blog-delta-summary.json','utf8'));
          if(x.deleted.length || x.changed.length<2 || x.changed.length>30 ||
             !x.changed.includes('personal-gym-first-session-pain-health-history/index.html') ||
             !x.changed.includes('index.html'))throw Error('UNEXPECTED_BLOG_RECOVERY_DELTA');
          const cmds=fs.readFileSync('.blog-delta.lftp','utf8').split('\n').filter(Boolean);
          if(cmds.some(x=>x.startsWith('mkdir -p ') || x.startsWith('rm ') || x.startsWith('mirror ') || x.startsWith('rmdir ')) ||
             !cmds.some(x=>x.startsWith('mkdir -pf ')))throw Error('NON_IDEMPOTENT_OR_UNSCOPED_RECOVERY_COMMAND');
          console.log('Exactly scoped Blog files:',x.changed);
          JS
          git worktree remove --force "$BASE"
      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Upload only verified blog delta with FTPS (do not mirror whole site)
        env:
          XSERVER_FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${XSERVER_FTP_USER:-}"
          test -n "${XSERVER_FTP_PASSWORD:-}"
          for ATTEMPT in 1 2 3; do
            if lftp -u "$XSERVER_FTP_USER","$XSERVER_FTP_PASSWORD" "$XSERVER_FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate yes
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 25
          source .blog-delta.lftp
          put -O "/" "deploy/sitemap.xml"
          bye
          EOF
            then
              echo "Scoped blog delta uploaded with HTTPS/FTPS verification pending."
              exit 0
            fi
            echo "::warning::Scoped Xserver upload attempt $ATTEMPT failed"
            if [ "$ATTEMPT" -lt 3 ]; then sleep $((ATTEMPT*15)); fi
          done
          echo "::error::BLOG_RECOVERY_UPLOAD_FAILED"
          exit 1
      - name: Verify exact production HTML bytes, link listing and article canonical
        run: |
          set -euo pipefail
          node scripts/verify-blog-delta-live.mjs
          TARGET_URL="$PRODUCTION_URL/blog/$TARGET_SLUG/"
          HTTP="$(curl -sS -L --connect-timeout 10 --max-time 25 -o /tmp/r7-article.html -w '%{http_code}' "$TARGET_URL")"
          test "$HTTP" = "200"
          grep -qF "$TARGET_SLUG" /tmp/r7-article.html
          grep -qF '痛みや体調は' /tmp/r7-article.html
          grep -qF "/blog/$TARGET_SLUG/" deploy/blog/index.html
          echo "R7 target article exact publication recovery passed. GBP untouched."
