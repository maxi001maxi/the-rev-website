name: Auto Editorial Hybrid Images

on:
  push:
    branches: [main]
    paths:
      - 'editorial/hybrid-image-jobs/**.json'
      - 'editorial/automated-image-sources.json'
      - 'scripts/auto-editorial-hybrid-image.mjs'
      - 'scripts/render-hybrid-editorial-overlay.mjs'
      - 'lib/editorialAutomatedHybridImage.mjs'
      - 'lib/editorialHybridImageFormat.mjs'
      - 'lib/editorialSceneGrounding.mjs'
      - 'lib/editorialImageOperatorRecovery.mjs'
      - 'lib/editorialThumbnailTypography.mjs'
      - 'editorial/typography-golden-reference/**'
      - '.github/workflows/auto-editorial-hybrid-images.yml'
  schedule:
    # One business-day safety window for the morning editorial pipeline.
    # THE REV. business days: Tue/Wed/Thu/Sat/Sun JST.
    # 06:00 JST = 21:00 UTC on the previous UTC day, so Mon/Tue/Wed/Fri/Sat UTC.
    # Push remains the primary event-driven trigger when a new image job is created.
    - cron: '0 21 * * 1,2,3,5,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-editorial-hybrid-images
  cancel-in-progress: false

env:
  PRODUCTION_URL: 'https://therev-lab.com'
  XSERVER_FTP_HOST: 'sv14602.xserver.jp'
  XSERVER_REMOTE_DIR: '/'
  EDITORIAL_IMAGE_GENERATION_MODEL: 'gpt-5.6'
  EDITORIAL_IMAGE_QA_MODEL: 'gpt-5.6'
  EDITORIAL_IMAGE_MAX_ATTEMPTS: '3'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XSERVER_FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
      XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Select pending Hybrid jobs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          : > .operator-jobs

          if [ "$EVENT_NAME" = "push" ] && [ -n "${EVENT_BEFORE:-}" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA" -- 'editorial/hybrid-image-jobs/*.json' \
              | grep -E '^editorial/hybrid-image-jobs/[^/]+\.json$' \
              | grep -v '/_template\.json$' \
              | sort -u > .candidate-jobs || true
          else
            find editorial/hybrid-image-jobs -maxdepth 1 -type f -name '*.json' \
              ! -name '_template.json' | sort > .candidate-jobs
          fi

          python3 <<'PY'
          import json
          from pathlib import Path

          def read_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return {}

          pending = []
          candidates = Path('.candidate-jobs').read_text(encoding='utf-8').splitlines() if Path('.candidate-jobs').exists() else []
          for raw in candidates:
              job = Path(raw.strip())
              if not raw.strip() or not job.is_file():
                  continue

              data = read_json(job)
              automation = data.get('automation') or {}
              automation_mode = str(automation.get('mode') or '')
              source_repo_path = str(automation.get('source_repo_path') or '')
              scene = str(data.get('generated_scene_path') or '')

              if automation_mode != 'unattended-github-actions-v1':
                  print(f"Skipping legacy/manual Hybrid job (not owned by automated operator): {job}")
                  continue
              if not source_repo_path or not Path(source_repo_path).is_file():
                  print(f"Skipping automated Hybrid job waiting for verified repo source: {job} ({source_repo_path or 'empty'})")
                  continue
              if not scene:
                  print(f"Skipping automated Hybrid job missing generated_scene_path: {job}")
                  continue

              slug = str(data.get('slug') or '')
              qa = str(data.get('qa_report_path') or '')
              thumb = str(data.get('thumbnail') or '')
              og = str(data.get('og_image') or '')
              gbp = str(data.get('gbp_image') or '')
              state = Path(f'editorial/image-operator-state/{slug}.json')

              state_data = read_json(state) if state.is_file() else {}
              qa_data = read_json(qa) if qa and Path(qa).is_file() else {}
              gbp_ready = (not gbp) or Path(gbp).is_file()
              already_ready = (
                  state_data.get('xserver_verified') is True
                  and bool(qa) and Path(qa).is_file() and qa_data.get('pass') is True
                  and bool(thumb) and Path(thumb).is_file()
                  and bool(og) and Path(og).is_file()
                  and gbp_ready
              )
              if already_ready:
                  print(f"Already generated and Xserver-verified: {job}")
                  continue
              pending.append(str(job))

          pending = sorted(set(pending))
          Path('.operator-jobs').write_text(('\n'.join(pending) + '\n') if pending else '', encoding='utf-8')
          print("Pending automated Hybrid jobs:")
          for job in pending:
              print(job)
          PY

          if [ -s .operator-jobs ]; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
            echo "No pending Hybrid jobs; skipping dependency installation and generation."
          fi

      - name: Validate required secrets
        if: steps.select.outputs.has_pending == 'true'
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "::error::OPENAI_API_KEY is required."; exit 1; }
          test -n "${XSERVER_FTP_USER:-}" || { echo "::error::XSERVER_FTP_USER is required."; exit 1; }
          test -n "${XSERVER_FTP_PASSWORD:-}" || { echo "::error::XSERVER_FTP_PASSWORD is required."; exit 1; }

      - name: Install dependencies
        if: steps.select.outputs.has_pending == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk lftp jq

      - name: Generate scenes, render overlay and run multimodal QC
        if: steps.select.outputs.has_pending == 'true'
        id: generate
        run: |
          set -euo pipefail
          : > .ready-paths
          : > .ready-image-paths
          : > .state-paths
          failed=0

          if [ ! -s .operator-jobs ]; then
            echo "No pending Hybrid jobs."
            echo "failed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r job; do
            [ -n "$job" ] || continue

            slug="$(jq -r '.slug' "$job")"
            scene="$(jq -r '.generated_scene_path' "$job")"
            thumb="$(jq -r '.thumbnail' "$job")"
            og="$(jq -r '.og_image' "$job")"
            gbp="$(jq -r '.gbp_image // ""' "$job")"
            qa="$(jq -r '.qa_report_path' "$job")"
            state="editorial/image-operator-state/${slug}.json"

            node scripts/auto-editorial-hybrid-image.mjs "$job"

            test -f "$state"
            printf '%s\n' "$state" >> .state-paths
            status="$(jq -r '.status // ""' "$state")"

            if [ "$status" = "READY_CANDIDATE" ]; then
              test -f "$scene"
              test -f "$thumb"
              test -f "$og"
              if [ -n "$gbp" ]; then test -f "$gbp"; fi
              test -f "$qa"
              test "$(jq -r '.pass // false' "$qa")" = "true"

              printf '%s\n' "$scene" "$thumb" "$og" "$qa" "$state" "$job" >> .ready-paths
              if [ "$slug" = "shinomiya-gym-beginner-choose" ] && [ -f editorial/image-qa/scene-grounding-r3-negative-control.json ]; then
                printf '%s\n' editorial/image-qa/scene-grounding-r3-negative-control.json >> .ready-paths
              fi
              # Retain actual small-size QC evidence without deploying previews.
              if [ "$(jq -r '.thumbnail_typography_revision // ""' "$qa")" = "thumbnail-golden-typography-v1" ]; then
                test -f "${thumb}.typography.json"
                printf '%s\n' "${thumb}.typography.json" >> .ready-paths
                jq -r '.thumbnail_typography_acceptance.deterministic.variants[].previews[].path' "$qa" >> .ready-paths
              fi
              if [ -n "$gbp" ]; then printf '%s\n' "$gbp" >> .ready-paths; fi
              printf '%s\n' "$thumb" "$og" >> .ready-image-paths
              if [ -n "$gbp" ]; then printf '%s\n' "$gbp" >> .ready-image-paths; fi
            elif [ "$status" = "BLOCKED_PROVIDER_CREDITS" ]; then
              echo "::warning::Hybrid image generation is blocked by provider credits for $slug. QC attempts were preserved; a later scheduled run can resume after credits are restored."
            else
              echo "::error::Hybrid image operator did not reach READY_CANDIDATE for $slug (status=$status)"
              failed=1
            fi
          done < .operator-jobs

          sort -u .ready-paths -o .ready-paths
          sort -u .ready-image-paths -o .ready-image-paths
          sort -u .state-paths -o .state-paths
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Preserve operator output before GitHub synchronization
        if: always() && steps.select.outputs.has_pending == 'true'
        run: |
          set -euo pipefail
          : > .checkpoint-paths
          for manifest in .ready-paths .state-paths; do
            if [ -f "$manifest" ]; then
              while IFS= read -r p; do
                if [ -n "$p" ] && [ -f "$p" ]; then printf '%s\n' "$p" >> .checkpoint-paths; fi
              done < "$manifest"
            fi
          done
          if [ -f editorial/image-qa/scene-grounding-r3-negative-control.json ]; then
            printf '%s\n' editorial/image-qa/scene-grounding-r3-negative-control.json >> .checkpoint-paths
          fi
          sort -u .checkpoint-paths -o .checkpoint-paths
          if [ -s .checkpoint-paths ]; then
            tar -czf editorial-operator-checkpoint.tar.gz -T .checkpoint-paths
          fi

      - name: Upload operator recovery checkpoint
        if: always() && steps.select.outputs.has_pending == 'true' && hashFiles('editorial-operator-checkpoint.tar.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: editorial-operator-checkpoint-${{ github.run_id }}
          path: editorial-operator-checkpoint.tar.gz
          retention-days: 7

      - name: Validate Hybrid image system
        if: steps.select.outputs.has_pending == 'true' && steps.generate.outputs.failed == '0'
        run: |
          set -euo pipefail
          node scripts/validate-hybrid-image-jobs.mjs
          node scripts/validate-editorial-image-system.mjs
          npm run test:phase-9

      - name: Commit operator output to main
        if: steps.select.outputs.has_pending == 'true'
        run: |
          set -euo pipefail
          git config user.name "THE REV Editorial Image Operator"
          git config user.email "actions@users.noreply.github.com"

          if [ -s .ready-paths ]; then
            while IFS= read -r p; do [ -n "$p" ] && git add "$p"; done < .ready-paths
          fi
          if [ -s .state-paths ]; then
            while IFS= read -r p; do [ -n "$p" ] && git add "$p"; done < .state-paths
          fi

          if git diff --cached --quiet; then
            echo "No operator output changes to commit."
          else
            git commit -m "Generate Editorial Hybrid image assets"
            # Other authorized workflows may advance main while generation runs.
            # Rebase only the staged operator output; a conflict stops acceptance.
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Stage READY image assets to Xserver
        if: steps.select.outputs.has_pending == 'true' && steps.generate.outputs.failed == '0'
        run: |
          set -euo pipefail
          if [ ! -s .ready-image-paths ]; then
            echo "No new READY image assets to stage."
            exit 0
          fi

          COMMANDS="$(mktemp)"
          trap 'rm -f "$COMMANDS"' EXIT
          {
            echo "set ftp:ssl-force true"
            echo "set ftp:ssl-protect-data true"
            echo "set ftp:passive-mode true"
            echo "set ssl:verify-certificate yes"
            echo "set net:max-retries 3"
            echo "set net:timeout 25"
            echo "set net:reconnect-interval-base 5"
            echo "mkdir -p ${XSERVER_REMOTE_DIR}assets/images/blog"
            echo "mkdir -p ${XSERVER_REMOTE_DIR}assets/images/blog/og"
            echo "mkdir -p ${XSERVER_REMOTE_DIR}assets/images/gbp"
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              echo "put \"$p\" -o \"${XSERVER_REMOTE_DIR}$p\""
            done < .ready-image-paths
            echo "bye"
          } > "$COMMANDS"

          STAGE_OK=0
          for ATTEMPT in 1 2 3; do
            echo "Editorial asset stage attempt ${ATTEMPT}/3"
            if lftp -u "$XSERVER_FTP_USER","$XSERVER_FTP_PASSWORD" "$XSERVER_FTP_HOST" < "$COMMANDS"; then
              STAGE_OK=1
              break
            fi
            echo "::warning::Editorial asset stage attempt ${ATTEMPT}/3 failed; retrying with a fresh FTPS session."
            sleep $((ATTEMPT * 15))
          done

          if [ "$STAGE_OK" != "1" ]; then
            echo "::error::Editorial image assets could not be staged to Xserver after 3 independent FTPS sessions."
            exit 1
          fi

          rm -f "$COMMANDS"
          trap - EXIT

      - name: Verify Xserver assets are byte-identical
        if: steps.select.outputs.has_pending == 'true' && steps.generate.outputs.failed == '0'
        run: |
          set -euo pipefail
          if [ ! -s .ready-image-paths ]; then
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          CACHE_BUST="hybrid-auto=${GITHUB_RUN_ID}"

          while IFS= read -r image_path; do
            [ -n "$image_path" ] || continue
            live_file="$TMP_DIR/$(basename "$image_path")"
            local_sha="$(sha256sum "$image_path" | awk '{print $1}')"
            ready=0

            for attempt in $(seq 1 20); do
              code="$(curl -sS -L -o "$live_file" -w '%{http_code}'                 --connect-timeout 8 --max-time 25                 "${PRODUCTION_URL}/${image_path}?${CACHE_BUST}&attempt=${attempt}" || echo '000')"

              if [ "$code" = "200" ] && [ -s "$live_file" ]; then
                live_sha="$(sha256sum "$live_file" | awk '{print $1}')"
                if [ "$live_sha" = "$local_sha" ]; then
                  echo "Hybrid asset ready ${attempt}/20: /${image_path}"
                  ready=1
                  break
                fi
              fi
              sleep 15
            done

            if [ "$ready" != "1" ]; then
              echo "::error::Hybrid asset did not become byte-identical: /${image_path}"
              exit 1
            fi
          done < .ready-image-paths

      - name: Mark Xserver verification in operator state
        if: steps.select.outputs.has_pending == 'true' && steps.generate.outputs.failed == '0'
        run: |
          set -euo pipefail
          if [ ! -s .state-paths ]; then
            exit 0
          fi

          changed=0
          while IFS= read -r state; do
            [ -n "$state" ] || continue
            [ -f "$state" ] || continue
            if [ "$(jq -r '.status // ""' "$state")" != "READY_CANDIDATE" ]; then
              continue
            fi
            tmp="$(mktemp)"
            jq '. + {xserver_verified:true, xserver_verified_at:(now | todateiso8601)}' "$state" > "$tmp"
            mv "$tmp" "$state"
            git add "$state"
            changed=1
          done < .state-paths

          if [ "$changed" = "1" ] && ! git diff --cached --quiet; then
            git commit -m "Mark Editorial Hybrid assets Xserver verified"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail closed if any operator job was rejected
        if: steps.select.outputs.has_pending == 'true' && steps.generate.outputs.failed != '0'
        run: |
          echo "::error::At least one automated Hybrid image job failed Visual QC or exhausted attempts."
          exit 1
