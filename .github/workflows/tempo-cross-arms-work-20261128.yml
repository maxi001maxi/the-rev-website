name: Nov28 crossed-arms image replacement and readonly preflight
on:
  push:
    branches: [work/tempo-cross-arms-20261128]
    paths: ['.github/workflows/tempo-cross-arms-work-20261128.yml']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: tempo-work-20261128
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_BRANCH: main
      PRODUCTION_URL: https://therev-lab.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Required article checks without AI APIs
        run: |
          npm run test:editorial-images
          npm run test:phase-9
          npm run test:daily-editorial-contract
          npm run test:daily-editorial-state-machine
          npm run test:daily-creator
          npm run build:blog
      - name: Verify exact unpublished draft, allowed PR scope and accepted image hashes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          import {hybridQaReady} from './lib/editorialHybridImageFormat.mjs';
          import {evaluateEditorialImageReview} from './lib/editorialImageReviewGate.mjs';
          import {validateDraftForPublish} from './lib/blogMarkdown.mjs';
          const d=JSON.parse(fs.readFileSync('editorial/prepublication/2026-11-28-repetition-tempo/CMS_PENDING.json'));
          if(d.id!=='9eb31128-f946-44f1-a410-d54c72e8171c'||d.slug!=='strength-training-slow-repetition-tempo'||d.publish_status!=='NOT_PUBLISHED'||d.source_path)throw Error('Unexpected draft/state');
          if(!hybridQaReady(d)||!evaluateEditorialImageReview({draft:d}).ok||validateDraftForPublish(d).length)throw Error('QC failed');
          const h={Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'};
          const base='https://api.github.com/repos/'+process.env.GITHUB_REPO;
          const files=await fetch(base+'/pulls/325/files?per_page=100',{headers:h}).then(r=>r.json());
          if(!Array.isArray(files)||!files.length)throw Error('PR files unavailable');
          const allowed=p=>p==='docs/operations/COLUMN_LATEST_HANDOFF.md'||p==='editorial/image-qa/strength-training-slow-repetition-tempo-reference-v26-tempo-20261128-work-r2.json'||p.startsWith('editorial/prepublication/2026-11-28-repetition-tempo/')||(p.startsWith('assets/images/')&&p.includes('strength-training-slow-repetition-tempo-reference-v26-tempo-20261128-work-r'))||['editorial/hybrid-image-jobs/strength-training-slow-repetition-tempo.json','editorial/image-operator-state/strength-training-slow-repetition-tempo.json','editorial/image-qa/strength-training-slow-repetition-tempo-reference-v26-tempo-20261128-work-r3.json','.github/workflows/tempo-cross-arms-work-20261128.yml'].includes(p);
          if(files.some(f=>!allowed(f.filename)||f.status==='removed'))throw Error('Out-of-scope PR change');
          const paths=[['thumbnail',d.thumbnail],['og',d.og_image],['gbp',d.gbp_image]].map(([variant,p])=>({variant,path:p.slice(1),sha256:d.image_qa.scene_grounding.asset_hashes[variant]}));
          for(const a of paths){if(!a.path.endsWith('strength-training-slow-repetition-tempo-reference-v26-tempo-20261128-work-r3.jpg'))throw Error('Bad delivery path');if(createHash('sha256').update(fs.readFileSync(a.path)).digest('hex')!==a.sha256)throw Error('Accepted hash mismatch');}
          fs.writeFileSync('/tmp/tempo-paths',paths.map(a=>a.path).join('\n')+'\n');fs.writeFileSync('/tmp/tempo-acceptance.json',JSON.stringify(paths));
          JS
      - name: Deliver only three new image filenames
        env:
          XSERVER_FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$XSERVER_FTP_USER"
          test -n "$XSERVER_FTP_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          COMMANDS="$(mktemp)"
          trap 'rm -f "$COMMANDS"' EXIT
          {
            echo 'set ftp:ssl-force true'
            echo 'set ftp:ssl-protect-data true'
            echo 'set ftp:passive-mode true'
            echo 'set ssl:verify-certificate yes'
            echo 'set net:max-retries 1'
            echo 'set net:timeout 25'
            while IFS= read -r p; do
              case "$p" in assets/images/*strength-training-slow-repetition-tempo-reference-v26-tempo-20261128-work-r3.jpg) ;; *) exit 1 ;; esac
              printf 'put "%s" -o "/%s"\n' "$p" "$p"
            done < /tmp/tempo-paths
            echo bye
          } > "$COMMANDS"
          lftp -u "$XSERVER_FTP_USER","$XSERVER_FTP_PASSWORD" sv14602.xserver.jp < "$COMMANDS"
      - name: Check live HTTP200 and exact SHA256
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const assets=[];
          for(const a of JSON.parse(fs.readFileSync('/tmp/tempo-acceptance.json'))){const url='https://therev-lab.com/'+a.path;const r=await fetch(url+'?tempo_delivery='+process.env.GITHUB_RUN_ID,{signal:AbortSignal.timeout(30000)});const b=Buffer.from(await r.arrayBuffer());const sha=createHash('sha256').update(b).digest('hex');if(r.status!==200||sha!==a.sha256)throw Error('Live mismatch '+a.variant);assets.push({...a,url,http_status:r.status,remote_sha256:sha,bytes:b.length,match:true});}
          fs.writeFileSync('editorial/prepublication/2026-11-28-repetition-tempo/XSERVER_EVIDENCE.json',JSON.stringify({all_match:assets.length===3,assets,checked_at:new Date().toISOString(),run_id:process.env.GITHUB_RUN_ID,scope:'Only three new accepted images; no HTML or published articles',blog_published:false,gbp_posted:false,external_ai_api_calls:0},null,2)+'\n');
          JS
      - name: Merge this draft-data PR after delivery; article remains unpublished
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/'+process.env.GITHUB_REPO;const headers={Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          const pr=await fetch(base+'/pulls/325',{headers}).then(r=>r.json());
          if(pr.base.ref!=='main'||pr.head.sha!==process.env.GITHUB_SHA)throw Error('PR head/base moved');
          if(!pr.merged){const r=await fetch(base+'/pulls/325/merge',{method:'PUT',headers,body:JSON.stringify({sha:process.env.GITHUB_SHA,merge_method:'merge',commit_title:'Prepare Nov28 article and staged images (no article publication)'})});const v=await r.json();if(!r.ok||!v.merged)throw Error(JSON.stringify(v));console.log('Draft-data PR merged:',v.sha);}
          JS
      - name: Run unchanged canonical preflight against actual CMS readback and real main/assets
        run: node editorial/prepublication/2026-11-28-repetition-tempo/final-preflight.mjs
      - name: Save delivery and preflight receipts without a second deployment
        run: |
          git restore --worktree -- admin/js/generated-page-catalog.mjs blog sitemap.xml
          git fetch origin main
          git checkout --detach origin/main
          node --input-type=module -e "import fs from 'node:fs';const p='editorial/image-operator-state/strength-training-slow-repetition-tempo.json';const s=JSON.parse(fs.readFileSync(p));s.xserver_verified=true;s.xserver_verified_at=new Date().toISOString();s.delivery_run_id=process.env.GITHUB_RUN_ID;fs.writeFileSync(p,JSON.stringify(s,null,2)+'\\n');"
          git add -- editorial/image-operator-state/strength-training-slow-repetition-tempo.json editorial/prepublication/2026-11-28-repetition-tempo/XSERVER_EVIDENCE.json editorial/prepublication/2026-11-28-repetition-tempo/FINAL_PREFLIGHT.json
          git -c user.name='THE REV Editorial Work' -c user.email='actions@users.noreply.github.com' commit -m 'Verify Nov28 crossed-arms R3 delivery and unpublished canonical preflight'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tempo-nov28-proof-${{ github.run_id }}
          path: |
            editorial/prepublication/2026-11-28-repetition-tempo/XSERVER_EVIDENCE.json
            editorial/prepublication/2026-11-28-repetition-tempo/FINAL_PREFLIGHT.json
