name: P2 Offline Image Pilot

# Deliberately MANUAL ONLY. No push/schedule trigger, no write token,
# no Xserver deployment, no CMS/LINE update. Results remain private artifacts.
on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Run one case or all five (maximum one scene attempt per case)"
        required: true
        type: choice
        options:
          - p2-01
          - p2-02
          - p2-03
          - p2-04
          - p2-05
          - all

permissions:
  contents: read

concurrency:
  group: editorial-image-phase2-offline
  cancel-in-progress: false

env:
  EDITORIAL_IMAGE_GENERATION_MODEL: gpt-5.6
  EDITORIAL_IMAGE_QA_MODEL: gpt-5.6
  EDITORIAL_IMAGE_MAX_ATTEMPTS: '1'

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Reject re-runs and stale branches before any billable API call
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "::error::Re-run jobs repeats the old commit and may waste image API credits. Open Actions > P2 Offline Image Pilot > Run workflow on main to start a NEW run."
            exit 1
          fi
          if [ "$REF_NAME" != "refs/heads/main" ]; then
            echo "::error::P2 pilot must be dispatched from main, not an old feature branch."
            exit 1
          fi
      - name: Checkout canonical baseline (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate secret and pilot
        env:
          CASE_ID: ${{ inputs.case_id }}
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "::error::OPENAI_API_KEY required"; exit 1; }
          case "$CASE_ID" in
            p2-01|p2-02|p2-03|p2-04|p2-05|all) ;;
            *) echo "::error::Unknown offline pilot case"; exit 1 ;;
          esac
          node --check scripts/materialize-editorial-image-p2-job.mjs
      - name: Preflight all requested cases before billable image generation
        env:
          CASE_ID: ${{ inputs.case_id }}
        run: |
          set -euo pipefail
          node scripts/preflight-editorial-image-p2.mjs "$CASE_ID" | tee .p2-preflight.json
      - name: Keep P2 preflight proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-preflight-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: .p2-preflight.json
      - name: Install renderer and review dependencies
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk jq
      - name: Render B scenes and check independent QC
        id: pilot
        env:
          CASE_ID: ${{ inputs.case_id }}
        run: |
          set -uo pipefail
          mkdir -p editorial/experiments/image-quality-p2/offline-output/paired
          cases="$CASE_ID"
          [ "$CASE_ID" = all ] && cases="p2-01 p2-02 p2-03 p2-04 p2-05"
          failed=0
          for case_id in $cases; do
            echo "::group::P2 $case_id"
            job="$(node scripts/materialize-editorial-image-p2-job.mjs "$case_id")" || { failed=1; echo "::endgroup::"; continue; }
            node scripts/auto-editorial-hybrid-image.mjs "$job" || failed=1
            slug="$(node -p "JSON.parse(require('fs').readFileSync('$job','utf8')).slug")"
            qa="$(node -p "JSON.parse(require('fs').readFileSync('$job','utf8')).qa_report_path")"
            output="editorial/experiments/image-quality-p2/offline-output/paired/$case_id"
            mkdir -p "$output"
            node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('editorial/experiments/image-quality-p2/cohort.json')); const x=c.cases.find(x=>x.case_id===process.argv[1]); const j=JSON.parse(fs.readFileSync('editorial/hybrid-image-jobs/'+x.slug+'.json')); fs.copyFileSync(j.thumbnail,process.argv[2]+'/baseline.jpg')" "$case_id" "$output"
            state="editorial/image-operator-state/$slug.json"
            if [ -f "$state" ] && [ -f "$qa" ] && [ "$(jq -r '.status // ""' "$state")" = READY_CANDIDATE ] && [ "$(jq -r '.pass // false' "$qa")" = true ]; then
              image="$(node -p "JSON.parse(require('fs').readFileSync('$job','utf8')).thumbnail")"
              test -f "$image" && cp "$image" "$output/improved.jpg" || failed=1
              echo "P2 $case_id independent Visual QC PASS (still offline)"
            else
              echo "::warning::P2 $case_id image is not independently QC PASS. No acceptance."
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" = 0 ]; then echo "failed=false" >> "$GITHUB_OUTPUT"; else echo "failed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Verify P2 artifacts and assemble anonymized A/B review pairs
        if: always() && steps.pilot.outcome != 'skipped'
        env:
          CASE_ID: ${{ inputs.case_id }}
        run: |
          set -euo pipefail
          node scripts/package-editorial-image-p2-results.mjs "$CASE_ID"
      - name: Upload offline evidence ONLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-offline-image-comparison-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            editorial/experiments/image-quality-p2/offline-output/jobs/**
            editorial/experiments/image-quality-p2/offline-output/qa/**
            editorial/experiments/image-quality-p2/offline-output/scenes/**
            editorial/experiments/image-quality-p2/offline-output/paired/**
            editorial/experiments/image-quality-p2/offline-output/reports/**
            editorial/image-operator-state/p2-*.json
            assets/images/blog/thumb-p2-*.jpg
            assets/images/blog/thumb-p2-*.jpg.typography.json
            assets/images/blog/thumb-p2-*-preview-*.jpg
            assets/images/blog/og/og-p2-*.jpg
            assets/images/gbp/gbp-p2-*.jpg
            assets/images/gbp/gbp-p2-*-preview-*.jpg
      - name: Upload anonymous gallery for blind human scoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-blind-review-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: editorial/experiments/image-quality-p2/offline-output/reviewer/**
      - name: Upload separate answer key (do not open until after scoring)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-unblind-key-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: editorial/experiments/image-quality-p2/offline-output/private-answer-key/**
      - name: Fail closed if any case is rejected
        if: steps.pilot.outputs.failed == 'true'
        run: |
          echo "::error::One or more P2 candidates failed independent QA. No production assets changed."
          exit 1
