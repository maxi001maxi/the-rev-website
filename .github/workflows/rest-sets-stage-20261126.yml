name: Nov26 accepted image delivery only
on:
  push:
    branches: [ops/rest-sets-image-stage-20261126]
    paths: ['.github/workflows/rest-sets-stage-20261126.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: rest-sets-image-stage-20261126
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify article and image gates, record exact three accepted filenames
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          import {hybridQaReady} from './lib/editorialHybridImageFormat.mjs';
          import {evaluateEditorialImageReview} from './lib/editorialImageReviewGate.mjs';
          import {validateDraftForPublish} from './lib/blogMarkdown.mjs';
          const d=JSON.parse(fs.readFileSync('editorial/prepublication/2026-11-26-rest-between-sets/CMS_PENDING.json'));
          if(d.slug!=='strength-training-rest-between-sets'||d.publish_status!=='NOT_PUBLISHED'||d.source_path)throw Error('Unexpected target/state');
          if(!hybridQaReady(d)||!evaluateEditorialImageReview({draft:d}).ok||validateDraftForPublish(d).length)throw Error('Article or image QC failed');
          const paths=[['thumbnail',d.thumbnail],['og',d.og_image],['gbp',d.gbp_image]].map(([variant,p])=>({variant,path:p.slice(1),sha256:d.image_qa.scene_grounding.asset_hashes[variant]}));
          for(const a of paths){if(!a.path.includes('strength-training-rest-between-sets-reference-v26-rest-sets-20261126-work-r1.jpg'))throw Error('Out-of-scope path');if(createHash('sha256').update(fs.readFileSync(a.path)).digest('hex')!==a.sha256)throw Error('Accepted byte mismatch');}
          fs.writeFileSync('.rest-image-paths',paths.map(a=>a.path).join('\n')+'\n');fs.writeFileSync('.rest-image-acceptance.json',JSON.stringify(paths));
          JS
      - name: Stop only this task's redundant full deployment while still backing up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const run=await fetch(base+'/actions/runs/45773746273',{headers}).then(r=>r.json());
          if(run.head_sha!=='27c50d383bd3e6eadfc518d69fb19630c89a4fdc')throw Error('Unexpected deployment');
          if(run.status==='completed'){console.log('Original deployment already complete; nothing cancelled.');process.exit(0);}
          const jobs=await fetch(base+'/actions/runs/45773746273/jobs',{headers}).then(r=>r.json());
          const backingUp=jobs.jobs.some(j=>j.steps.some(s=>s.name==='Backup current Xserver production'&&s.status==='in_progress'));
          if(!backingUp){console.log('Deployment passed backup; leave it untouched.');process.exit(0);}
          const cancelled=await fetch(base+'/actions/runs/45773746273/cancel',{headers,method:'POST'});
          if(!cancelled.ok)throw Error('Unable to stop redundant backup: '+cancelled.status);
          console.log('Cancelled this task’s full deployment while it was still backing up. Only the three accepted image files will be delivered.');
          JS
      - name: Stage only the three new image filenames
        env:
          XSERVER_FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$XSERVER_FTP_USER"
          test -n "$XSERVER_FTP_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          COMMANDS="$(mktemp)"
          trap 'rm -f "$COMMANDS"' EXIT
          {
            echo 'set ftp:ssl-force true'
            echo 'set ftp:ssl-protect-data true'
            echo 'set ftp:passive-mode true'
            echo 'set ssl:verify-certificate yes'
            echo 'set net:max-retries 1'
            echo 'set net:timeout 25'
            while IFS= read -r p; do
              case "$p" in assets/images/*strength-training-rest-between-sets-reference-v26-rest-sets-20261126-work-r1.jpg) ;; *) exit 1 ;; esac
              printf 'put "%s" -o "/%s"\n' "$p" "$p"
            done < .rest-image-paths
            echo bye
          } > "$COMMANDS"
          lftp -u "$XSERVER_FTP_USER","$XSERVER_FTP_PASSWORD" sv14602.xserver.jp < "$COMMANDS"
      - name: Verify live HTTP and exact SHA256; retain delivery receipt
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const expected=JSON.parse(fs.readFileSync('.rest-image-acceptance.json'));const receipts=[];
          for(const a of expected){const url='https://therev-lab.com/'+a.path;const r=await fetch(url+'?rest_delivery='+process.env.GITHUB_RUN_ID,{signal:AbortSignal.timeout(30000)});const b=Buffer.from(await r.arrayBuffer());const hash=createHash('sha256').update(b).digest('hex');if(r.status!==200||hash!==a.sha256)throw Error('LIVE_BYTE_MISMATCH '+a.variant);receipts.push({...a,url,http_status:r.status,remote_sha256:hash,bytes:b.length,match:true});}
          const out={all_match:receipts.length===3,assets:receipts,checked_at:new Date().toISOString(),run_id:process.env.GITHUB_RUN_ID,scope:'Three new accepted image files only',blog_published:false,gbp_posted:false,db_writes:false,external_ai_api_calls:0};
          fs.writeFileSync('editorial/prepublication/2026-11-26-rest-between-sets/XSERVER_EVIDENCE.json',JSON.stringify(out,null,2)+'\n');
          JS
      - name: Preserve receipt on the working branch
        run: |
          git add -- editorial/prepublication/2026-11-26-rest-between-sets/XSERVER_EVIDENCE.json
          git -c user.name='THE REV Editorial Work' -c user.email='actions@users.noreply.github.com' commit -m 'Verify Nov26 three-image delivery by live SHA256'
          git push origin HEAD:ops/rest-sets-image-stage-20261126
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rest-sets-image-delivery-${{ github.run_id }}
          path: editorial/prepublication/2026-11-26-rest-between-sets/XSERVER_EVIDENCE.json
