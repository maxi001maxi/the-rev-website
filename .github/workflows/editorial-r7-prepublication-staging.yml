name: Editorial R7 Verified Prepublication Staging
# 2026-10-15: re-dispatch after correcting immutable GBP SHA256 pin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-r7-prepublication-staging.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: editorial-r7-prepublication-stage
  cancel-in-progress: false

env:
  R7_QC_RUN: '38677888686'
  R7_QC_ARTIFACT: 'editorial-20261015-portrait-r7-review-38677888686'
  PRODUCTION_URL: 'https://therev-lab.com'

jobs:
  stage-r7-assets-without-publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      XSERVER_FTP_HOST: 'sv14602.xserver.jp'
      XSERVER_FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
      XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download only the pinned independently approved R7 artifact
        run: |
          set -euo pipefail
          mkdir -p .r7-approved-source
          gh run download "$R7_QC_RUN" -R "$GITHUB_REPOSITORY" \
            --name "$R7_QC_ARTIFACT" --dir .r7-approved-source
          test -s .r7-approved-source/independent-visual-qa.json
          test -s .r7-approved-source/evaluation.json

      - name: Verify authentic source, all 3 SHA-pinned images, QA and review-only boundary
        run: |
          set -euo pipefail
          node scripts/stage-verified-editorial-r7-candidate.mjs .r7-approved-source
          test -s .r7-image-assets
          test -s .r7-prepublish-paths
          node -e "const x=require('./editorial/image-review/2026-10-15-health-pain-r7-prepublication.json'); if(x.independent_qc_pass!==true||x.actual_blog_published!==false||x.gbp_posted!==false||x.reviewed_by_owner!==false){throw Error('Owner review boundary invalid')}"

      - name: Commit only verified unreferenced images and QA to GitHub
        run: |
          set -euo pipefail
          git config user.name "THE REV Editorial Prepublication"
          git config user.email "actions@users.noreply.github.com"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            test -f "$file"
            git add -- "$file"
          done < .r7-prepublish-paths
          if git diff --cached --quiet; then
            echo "Exact R7 media already staged in main."
          else
            git commit -m "Stage QC-passed Editorial R7 images for owner prepublication review"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Validate Xserver credentials for image staging only
        run: |
          set -euo pipefail
          test -n "$XSERVER_FTP_USER" || { echo "::error::Xserver username missing"; exit 1; }
          test -n "$XSERVER_FTP_PASSWORD" || { echo "::error::Xserver password missing"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Stage only the three R7 JPEGs without editing blog or GBP posts
        run: |
          set -euo pipefail
          COMMANDS="$(mktemp)"
          trap 'rm -f "$COMMANDS"' EXIT
          {
            echo "set ftp:ssl-force true"
            echo "set ftp:ssl-protect-data true"
            echo "set ftp:passive-mode true"
            echo "set ssl:verify-certificate yes"
            echo "set net:max-retries 3"
            echo "set net:timeout 25"
            echo "mkdir -p /assets/images/blog"
            echo "mkdir -p /assets/images/blog/og"
            echo "mkdir -p /assets/images/gbp"
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              test -f "$p"
              echo "put \"$p\" -o \"/$p\""
            done < .r7-image-assets
            echo "bye"
          } > "$COMMANDS"
          STAGED=0
          for attempt in 1 2 3; do
            if lftp -u "$XSERVER_FTP_USER","$XSERVER_FTP_PASSWORD" "$XSERVER_FTP_HOST" < "$COMMANDS"; then
              STAGED=1
              break
            fi
            sleep $((attempt * 12))
          done
          test "$STAGED" = '1'

      - name: Verify Xserver image SHA256 exact byte match
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          while IFS= read -r img; do
            [ -n "$img" ] || continue
            want="$(sha256sum "$img" | awk '{print $1}')"
            good=0
            for attempt in $(seq 1 18); do
              status="$(curl -sS -L -o "$TMP/asset.jpg" -w '%{http_code}' \
                --connect-timeout 8 --max-time 25 \
                "$PRODUCTION_URL/$img?r7-prepub=$GITHUB_RUN_ID&attempt=$attempt" || echo '000')"
              if [ "$status" = '200' ] && [ -s "$TMP/asset.jpg" ]; then
                got="$(sha256sum "$TMP/asset.jpg" | awk '{print $1}')"
                if [ "$got" = "$want" ]; then
                  echo "R7 SHA-verified image staged: $img"
                  good=1
                  break
                fi
              fi
              sleep 10
            done
            if [ "$good" != '1' ]; then
              echo "::error::Xserver image SHA256 does not match: $img"
              exit 1
            fi
          done < .r7-image-assets

      - name: Record verified prepublication stage (never publish an article)
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const p='editorial/image-review/2026-10-15-health-pain-r7-prepublication.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if(j.independent_qc_pass!==true||j.actual_blog_published!==false||
             j.gbp_posted!==false||j.canonical_job_modified!==false||
             j.reviewed_by_owner!==false)throw Error('Publication boundary unexpectedly changed');
          j.status='XSERVER_BYTE_VERIFIED_OWNER_REVIEW_PENDING';
          j.staging_on_xserver_verified=true;
          j.staging_run_id=process.env.GITHUB_RUN_ID;
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          JS
          git add -- editorial/image-review/2026-10-15-health-pain-r7-prepublication.json
          git commit -m "Mark R7 image bytes Xserver verified; owner publication approval pending"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "::notice::All 3 R7 images verified on Xserver; article/GBP still unpublished; owner approval pending."
