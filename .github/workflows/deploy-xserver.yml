# THE REV. — Xserver Production Deploy
#
# mainへの本番関連変更で自動起動し、必要に応じてworkflow_dispatchでも手動起動できる。
# 目的：
#   1) GitHub mainから公開物をビルドして事前検証
#   2) 現在のXserver本番をFTPSでバックアップ
#   3) XserverのFTPルート / へ安全に反映
#   4) therev-lab.com のTOP / Blog / 公開記事を実通信で確認
#
# 2026-09-17 に手動probeで確認:
#   - FTP / に置いたtxt → https://therev-lab.com/<file> で配信
#   - FTP /unlimited-dev は https://therev-lab.com/unlimited-dev/ でBasic認証
# よって本番DocumentRootはFTP / とする。
#
# 重要：
#   - Xserver側ルート全体には --delete を使わない。
#   - /unlimited-dev やXserver固有ファイルは削除しない。
#   - Blog配下だけは、GitHubの公開状態と一致させるため完全同期（--delete）する。
#   - dist/admin はVercel Functions前提の管理画面を含むためXserverへは配信しない。
#   - FTPパスワードはRepository Secretsからのみ読み、ログへ出さない。
#   - 当回バックアップがXserver側の一時的なFTPS不調で失敗した場合でも、48時間以内の
#     非expiredバックアップArtifactが存在する場合に限り、そのArtifactを安全網としてDeployを継続する。
name: Deploy to Xserver

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'assets/**'
      - 'content/blog/**'
      - 'scripts/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'favicon.ico'
      - 'robots.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: xserver-production-v2
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  XSERVER_FTP_HOST: 'sv14602.xserver.jp'
  XSERVER_REMOTE_DIR: '/'
  PRODUCTION_URL: 'https://therev-lab.com'

jobs:
  deploy:
    name: Build → Backup → Deploy → Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production files
        run: npm run vercel-build

      - name: Validate generated Blog against source status
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import matter from 'gray-matter';

          const contentDir = 'content/blog';
          const distBlogDir = 'dist/blog';
          const indexPath = path.join(distBlogDir, 'index.html');

          if (!fs.existsSync(indexPath)) {
            throw new Error('dist/blog/index.html が生成されていません。');
          }

          const files = fs.readdirSync(contentDir).filter((name) => name.endsWith('.md'));
          const published = [];
          const drafts = [];
          const publishedImages = new Set();

          for (const file of files) {
            const raw = fs.readFileSync(path.join(contentDir, file), 'utf8');
            const { data } = matter(raw);
            const slug = String(data.slug || path.basename(file, '.md')).trim();
            const status = String(data.status || 'draft').trim().toLowerCase();

            if (!/^[a-z0-9-]+$/.test(slug)) {
              throw new Error(`不正なslug: ${slug}`);
            }

            const generated = path.join(distBlogDir, slug, 'index.html');
            if (status === 'published') {
              if (!fs.existsSync(generated)) {
                throw new Error(`公開記事がdistにありません: ${slug}`);
              }
              published.push(slug);
              for (const imagePath of [data.thumbnail, data.og_image]) {
                if (typeof imagePath !== 'string' || !imagePath.startsWith('/assets/')) {
                  throw new Error(`公開記事の画像パスが不正です: ${slug} -> ${imagePath || '(empty)'}`);
                }
                const localImage = path.join('dist', imagePath.replace(/^\//, ''));
                if (!fs.existsSync(localImage)) {
                  throw new Error(`公開記事の画像がdistにありません: ${slug} -> ${imagePath}`);
                }
                publishedImages.add(imagePath);
              }
            } else {
              if (fs.existsSync(generated)) {
                throw new Error(`下書き記事がdistへ混入しています: ${slug}`);
              }
              drafts.push(slug);
            }
          }

          if (published.length === 0) {
            throw new Error('公開記事が0件です。デプロイを停止します。');
          }

          const blogIndex = fs.readFileSync(indexPath, 'utf8');
          for (const slug of published) {
            if (!blogIndex.includes(`/blog/${slug}/`)) {
              throw new Error(`Blog一覧に公開記事がありません: ${slug}`);
            }
          }
          for (const slug of drafts) {
            if (blogIndex.includes(`/blog/${slug}/`)) {
              throw new Error(`Blog一覧に下書き記事が混入しています: ${slug}`);
            }
          }

          fs.writeFileSync('.deploy-published-slugs', `${published.join('\n')}\n`);
          fs.writeFileSync('.deploy-draft-slugs', drafts.length ? `${drafts.join('\n')}\n` : '');
          fs.writeFileSync('.deploy-published-images', `${[...publishedImages].join('\n')}\n`);
          console.log(`Build validation OK — published: ${published.length}, draft: ${drafts.length}, images: ${publishedImages.size}`);
          NODE

      - name: Prepare Xserver payload
        run: |
          set -euo pipefail
          rm -rf deploy
          cp -a dist deploy
          rm -rf deploy/admin
          test -f deploy/index.html
          test -f deploy/blog/index.html
          test ! -e deploy/admin
          echo "Xserver payload prepared (dist/admin excluded)."

      - name: Validate Xserver secrets
        env:
          XSERVER_FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${XSERVER_FTP_USER:-}" ] || [ -z "${XSERVER_FTP_PASSWORD:-}" ]; then
            echo "::error::Repository Secrets XSERVER_FTP_USER / XSERVER_FTP_PASSWORD が未設定です。"
            exit 1
          fi
          echo "Xserver credentials: configured"

      - name: Install FTPS client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Backup current Xserver production
        id: backup
        env:
          XSERVER_FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          set -u
          STAMP="$(date -u +'%Y%m%dT%H%M%SZ')"
          BACKUP_DIR="xserver-backup/${STAMP}"
          mkdir -p "$BACKUP_DIR"

          BACKUP_OK=0
          for ATTEMPT in 1 2; do
            echo "Backup attempt ${ATTEMPT}/2"
            if lftp -u "$XSERVER_FTP_USER","$XSERVER_FTP_PASSWORD" "$XSERVER_FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 20
          set net:reconnect-interval-base 5
          mirror --continue --verbose --exclude-glob 'unlimited-dev/' --exclude-glob 'unlimited-dev/**' "$XSERVER_REMOTE_DIR" "$BACKUP_DIR/"
          bye
          EOF
            then
              if [ -f "$BACKUP_DIR/index.html" ]; then
                BACKUP_OK=1
                break
              fi
              echo "::warning::Backup接続は完了しましたが index.html を取得できませんでした。"
            fi
            echo "::warning::Xserver backup attempt ${ATTEMPT} failed. Retrying..."
            sleep $((ATTEMPT * 10))
          done

          echo "backup_dir=$BACKUP_DIR" >> "$GITHUB_OUTPUT"
          if [ "$BACKUP_OK" = "1" ]; then
            echo "backup_ok=true" >> "$GITHUB_OUTPUT"
            echo "Backup complete: $BACKUP_DIR"
          else
            echo "backup_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Current Xserver backup failed. Checking recent backup Artifact before deploy."
          fi

      - name: Check recent backup safety net
        id: backup_safety
        if: steps.backup.outputs.backup_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"
          JSON="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")"

          LATEST_LINE="$(printf '%s' "$JSON" | jq -r '
            [.artifacts[]
              | select(.expired == false)
              | select(.name | startswith("xserver-backup-"))
              | {name, created_at}]
            | sort_by(.created_at)
            | reverse
            | .[0] // empty
            | if . == "" then "" else "\(.name)|\(.created_at)" end
          ')"

          if [ -z "$LATEST_LINE" ]; then
            echo "::error::Current backup failed and no usable prior Xserver backup Artifact exists. Deployment stopped."
            exit 1
          fi

          FALLBACK_NAME="${LATEST_LINE%%|*}"
          FALLBACK_CREATED="${LATEST_LINE#*|}"
          FALLBACK_TS="$(date -u -d "$FALLBACK_CREATED" +%s)"
          CUTOFF_TS="$(date -u -d '48 hours ago' +%s)"

          if [ "$FALLBACK_TS" -lt "$CUTOFF_TS" ]; then
            echo "::error::Latest prior backup Artifact is older than 48 hours (${FALLBACK_CREATED}). Deployment stopped."
            exit 1
          fi

          echo "fallback_artifact=$FALLBACK_NAME" >> "$GITHUB_OUTPUT"
          echo "fallback_created_at=$FALLBACK_CREATED" >> "$GITHUB_OUTPUT"
          echo "::warning::Using recent prior backup safety net: ${FALLBACK_NAME} (${FALLBACK_CREATED})"

      - name: Store production backup artifact
        if: steps.backup.outputs.backup_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xserver-backup-${{ github.run_id }}
          path: ${{ steps.backup.outputs.backup_dir }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Deploy assets FIRST
        id: xserver_assets_deploy
        env:
          XSERVER_FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DEPLOY_OK=0
          for ATTEMPT in 1 2 3; do
            echo "Asset deploy attempt ${ATTEMPT}/3"
            if lftp -u "$XSERVER_FTP_USER","$XSERVER_FTP_PASSWORD" "$XSERVER_FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate yes
          set net:max-retries 5
          set net:timeout 30
          set net:reconnect-interval-base 5
          mkdir -p "${XSERVER_REMOTE_DIR}assets"
          mirror --reverse --verbose "deploy/assets/" "${XSERVER_REMOTE_DIR}assets/"
          bye
          EOF
            then
              DEPLOY_OK=1
              break
            fi
            echo "::warning::Xserver asset deploy attempt ${ATTEMPT} failed. Retrying..."
            sleep $((ATTEMPT * 20))
          done

          if [ "$DEPLOY_OK" != "1" ]; then
            echo "::error::Xserver asset upload failed after 3 attempts. Existing Blog remains untouched."
            exit 1
          fi

          echo "Xserver assets upload complete."

      - name: Wait until published images are live
        run: |
          set -euo pipefail
          CACHE_BUST="asset-gate=${GITHUB_RUN_ID}"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          wait_for_image() {
            local image_path="$1"
            local image_label="${image_path#/}"
            local local_file="dist/${image_label}"
            local live_file="$TMP_DIR/live-$(printf '%s' "$image_label" | tr '/ ' '__')"

            if [ ! -f "$local_file" ]; then
              echo "::error::比較元のdist画像がありません: ${image_path}"
              return 1
            fi

            local local_sha
            local_sha="$(sha256sum "$local_file" | awk '{print $1}')"

            # CDN / browser-facing cache can trail FTPS by several minutes.
            # Do not switch Blog HTML until the public URL serves the exact new bytes.
            for ATTEMPT in $(seq 1 20); do
              code=$(curl -sS -L -o "$live_file" -w '%{http_code}' \
                --connect-timeout 8 --max-time 20 \
                "${PRODUCTION_URL}${image_path}?${CACHE_BUST}&attempt=${ATTEMPT}" || echo '000')

              if [ "$code" = "200" ] && [ -s "$live_file" ]; then
                live_sha="$(sha256sum "$live_file" | awk '{print $1}')"
                if [ "$live_sha" = "$local_sha" ]; then
                  echo "Image ready ${ATTEMPT}/20: ${image_path}"
                  return 0
                fi
              fi

              echo "Waiting for image propagation ${ATTEMPT}/20: ${image_path} (HTTP ${code})"
              sleep 15
            done

            echo "::error::本番画像が新しいdist画像へ切り替わりませんでした: ${image_path}"
            return 1
          }

          while IFS= read -r image_path; do
            [ -z "$image_path" ] && continue
            wait_for_image "$image_path"
          done < .deploy-published-images

          echo "All published image assets are live and byte-identical. Blog switch is now safe."

      - name: Deploy root files after image gate
        env:
          XSERVER_FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$XSERVER_FTP_USER","$XSERVER_FTP_PASSWORD" "$XSERVER_FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate yes
          set net:max-retries 5
          set net:timeout 30
          set net:reconnect-interval-base 5
          cd "$XSERVER_REMOTE_DIR"
          mput -O "$XSERVER_REMOTE_DIR" deploy/*.html
          mput -O "$XSERVER_REMOTE_DIR" deploy/*.xml
          mput -O "$XSERVER_REMOTE_DIR" deploy/*.txt
          mput -O "$XSERVER_REMOTE_DIR" deploy/*.ico
          rm -f "${XSERVER_REMOTE_DIR}__rev_root_probe.txt"
          rm -f "${XSERVER_REMOTE_DIR}unlimited-dev/__rev_dev_probe.txt"
          bye
          EOF

      - name: Deploy Blog LAST
        id: xserver_deploy
        env:
          XSERVER_FTP_USER: ${{ secrets.XSERVER_FTP_USER }}
          XSERVER_FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          DEPLOY_OK=0
          for ATTEMPT in 1 2 3; do
            echo "Blog deploy attempt ${ATTEMPT}/3"
            if lftp -u "$XSERVER_FTP_USER","$XSERVER_FTP_PASSWORD" "$XSERVER_FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate yes
          set net:max-retries 5
          set net:timeout 30
          set net:reconnect-interval-base 5
          mkdir -p "${XSERVER_REMOTE_DIR}blog"
          mirror --reverse --delete --verbose "deploy/blog/" "${XSERVER_REMOTE_DIR}blog/"
          bye
          EOF
            then
              DEPLOY_OK=1
              break
            fi
            echo "::warning::Xserver Blog deploy attempt ${ATTEMPT} failed. Retrying..."
            sleep $((ATTEMPT * 20))
          done

          if [ "$DEPLOY_OK" != "1" ]; then
            echo "::error::Xserver Blog switch failed after 3 attempts. Assets are present but Blog HTML was not intentionally advanced."
            exit 1
          fi

          echo "Xserver Blog switch complete."

      - name: Verify live production
        run: |
          set -euo pipefail
          FAIL=0
          SUMMARY="$GITHUB_STEP_SUMMARY"
          CACHE_BUST="deploy=${GITHUB_RUN_ID}"
          TMP_DIR="$(mktemp -d)"

          echo "# Xserver Production Deploy" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "- Trigger: \`${GITHUB_EVENT_NAME}\`" >> "$SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$SUMMARY"
          echo "- Target: \`${PRODUCTION_URL}\`" >> "$SUMMARY"
          echo "- Remote: \`${XSERVER_FTP_HOST}:${XSERVER_REMOTE_DIR}\`" >> "$SUMMARY"
          if [ "${{ steps.backup.outputs.backup_ok }}" = "true" ]; then
            echo "- Backup: \`xserver-backup-${GITHUB_RUN_ID}\` (current run)" >> "$SUMMARY"
          else
            echo "- Backup safety net: \`${{ steps.backup_safety.outputs.fallback_artifact }}\`" >> "$SUMMARY"
          fi
          echo "" >> "$SUMMARY"
          echo "| Check | Result |" >> "$SUMMARY"
          echo "|---|---|" >> "$SUMMARY"

          fetch_page() {
            local label="$1"
            local url="$2"
            local outfile="$3"
            local code
            code=$(curl -sS -L -o "$outfile" -w '%{http_code}' \
              --retry 1 --retry-delay 2 --retry-all-errors --connect-timeout 8 --max-time 15 "$url" || echo '000')
            if [ "$code" = "200" ]; then
              echo "| ${label} | ✅ HTTP 200 |" >> "$SUMMARY"
            else
              echo "| ${label} | ❌ HTTP ${code} |" >> "$SUMMARY"
              FAIL=1
            fi
          }

          fetch_page "TOP" "${PRODUCTION_URL}/?${CACHE_BUST}" "$TMP_DIR/top.html"
          if ! grep -qF 'THE REV' "$TMP_DIR/top.html"; then
            echo "::error::TOPページ本文に THE REV が見つかりません。"
            FAIL=1
          fi

          fetch_page "Blog index" "${PRODUCTION_URL}/blog/?${CACHE_BUST}" "$TMP_DIR/blog.html"

          while IFS= read -r image_path; do
            [ -z "$image_path" ] && continue
            image_label="${image_path#/}"
            image_file="$TMP_DIR/image-$(printf '%s' "$image_label" | tr '/ ' '__')"
            local_file="dist/${image_label}"
            fetch_page "Image: ${image_label}" "${PRODUCTION_URL}${image_path}?${CACHE_BUST}" "$image_file"
            if [ ! -s "$image_file" ]; then
              echo "::error::本番画像が空です: ${image_path}"
              FAIL=1
              continue
            fi
            if [ ! -f "$local_file" ]; then
              echo "::error::比較元のdist画像がありません: ${image_path}"
              FAIL=1
              continue
            fi
            live_sha="$(sha256sum "$image_file" | awk '{print $1}')"
            local_sha="$(sha256sum "$local_file" | awk '{print $1}')"
            if [ "$live_sha" != "$local_sha" ]; then
              echo "::error::本番画像が今回のdist画像と一致しません: ${image_path}"
              echo "| Image bytes: ${image_label} | ❌ SHA256 mismatch |" >> "$SUMMARY"
              FAIL=1
            else
              echo "| Image bytes: ${image_label} | ✅ exact match |" >> "$SUMMARY"
            fi
          done < .deploy-published-images

          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            if ! grep -qF "/blog/${slug}/" "$TMP_DIR/blog.html"; then
              echo "::error::本番Blog一覧に公開記事がありません: ${slug}"
              echo "| Blog link: ${slug} | ❌ missing |" >> "$SUMMARY"
              FAIL=1
            else
              echo "| Blog link: ${slug} | ✅ listed |" >> "$SUMMARY"
            fi
            fetch_page "Article: ${slug}" "${PRODUCTION_URL}/blog/${slug}/?${CACHE_BUST}" "$TMP_DIR/article-${slug}.html"
          done < .deploy-published-slugs

          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            if grep -qF "/blog/${slug}/" "$TMP_DIR/blog.html"; then
              echo "::error::本番Blog一覧に下書き記事が表示されています: ${slug}"
              echo "| Draft hidden: ${slug} | ❌ listed |" >> "$SUMMARY"
              FAIL=1
            else
              echo "| Draft hidden: ${slug} | ✅ not listed |" >> "$SUMMARY"
            fi

            code=$(curl -sS -L -o "$TMP_DIR/draft-${slug}.html" -w '%{http_code}' \
              --retry 1 --retry-delay 2 --retry-all-errors --connect-timeout 8 --max-time 15 \
              "${PRODUCTION_URL}/blog/${slug}/?${CACHE_BUST}" || echo '000')
            if [ "$code" = "200" ]; then
              echo "::error::下書き記事URLが本番でHTTP 200を返しています: ${slug}"
              echo "| Draft URL: ${slug} | ❌ HTTP 200 |" >> "$SUMMARY"
              FAIL=1
            else
              echo "| Draft URL: ${slug} | ✅ HTTP ${code} |" >> "$SUMMARY"
            fi
          done < .deploy-draft-slugs

          echo "" >> "$SUMMARY"
          if [ "$FAIL" = "0" ]; then
            echo "**結果: Xserver本番公開・公開記事・下書き非公開を確認しました。**" >> "$SUMMARY"
          else
            echo "**結果: 本番確認で失敗した項目があります。バックアップ安全網を保持したまま停止しました。**" >> "$SUMMARY"
          fi

          rm -rf "$TMP_DIR"
          exit "$FAIL"
