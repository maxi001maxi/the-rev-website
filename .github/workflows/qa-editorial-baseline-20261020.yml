name: Editorial baseline control - main 20261020
on:
  push:
    branches: [qa/verify-editorial-baseline-20261020]
permissions:
  contents: read
jobs:
  topic-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:topic-approval
