<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン｜THE REV. Editorial Console</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div id="checking" class="admin-loading">CHECKING SESSION…</div>

<main id="auth-screen" class="admin-auth-screen admin-hidden">
<div class="admin-auth-card">
<p class="admin-auth-mark">THE REV.</p>
<p class="admin-auth-sub">Editorial Console</p>

<div id="error-box" class="admin-error admin-hidden" role="alert"></div>

<form id="login-form" novalidate>
<div class="admin-field">
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="username" required>
</div>
<div class="admin-field">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
</div>
<button id="submit-btn" class="admin-submit" type="submit">ログイン</button>
</form>
</div>
</main>

<script type="module">
import { getSession, signInWithPassword } from '/admin/js/admin-auth.mjs';

const checking = document.getElementById('checking');
const screen = document.getElementById('auth-screen');
const form = document.getElementById('login-form');
const errorBox = document.getElementById('error-box');
const submitBtn = document.getElementById('submit-btn');

function showError(message) {
  errorBox.textContent = message;
  errorBox.classList.remove('admin-hidden');
}

(async () => {
  try {
    const { session } = await getSession();
    if (session) {
      location.replace('/admin/');
      return;
    }
  } catch (e) {
    // /api/config 未設定などの場合はログイン画面をそのまま表示し、送信時にエラーを出す
  }
  checking.classList.add('admin-hidden');
  screen.classList.remove('admin-hidden');
})();

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errorBox.classList.add('admin-hidden');
  submitBtn.disabled = true;
  submitBtn.textContent = 'ログイン中…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const { error } = await signInWithPassword(email, password);
    if (error) {
      showError('メールアドレスまたはパスワードが正しくありません。');
      return;
    }
    location.replace('/admin/');
  } catch (e) {
    showError('ログイン処理でエラーが発生しました。しばらくしてから再度お試しください。');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'ログイン';
  }
});
</script>
</body>
</html>
