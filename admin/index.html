<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE REV. Editorial Console</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap">
<style>
  :root{
    --paper:#FBFAF7; --charcoal:#26241F; --ink:#232220; --ink-soft:#5C574F;
    --wood:#C2A982; --wood-deep:#9C8160; --line:#E4DDCF;
    --serif:"Shippori Mincho",serif; --sans:"Zen Kaku Gothic New",sans-serif; --latin:"Jost",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--charcoal); color:var(--paper); font-family:var(--sans); text-align:center; padding:40px 24px;
  }
  .mark{ font-family:var(--latin); font-weight:400; letter-spacing:.4em; font-size:14px; color:var(--wood); text-indent:.4em; margin-bottom:28px; }
  h1{ font-family:var(--serif); font-weight:600; font-size:clamp(20px,3vw,28px); letter-spacing:.06em; margin:0 0 14px; }
  p{ font-family:var(--sans); font-weight:300; font-size:14px; line-height:2; color:rgba(251,250,247,.7); margin:0; }
</style>
</head>
<body>
<div>
  <p class="mark">THE REV.</p>
  <h1>Editorial Console</h1>
  <p>準備中です。ログイン・記事編集機能は近日追加されます。</p>
</div>
</body>
</html>
